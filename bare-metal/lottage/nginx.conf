# Traefik's routing table, in nginx. Rendered by deploy.sh and mounted at
# /etc/nginx/conf.d/default.conf.
#
# The host pairs below are the same ones the cluster's IngressRoutes match:
# base/traefik-routes/pihole-ingressroute.yaml and base/landing/ingressroute.yaml.
# Each service answers to both its site-qualified name and the bare one, and the
# bare one resolves to whichever site the client is standing in.

# Plaintext exists only to redirect, matching the entryPoint-level redirect
# configured once in base/traefik/helmrelease.yaml.
server {
    listen 8080 default_server;
    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name pihole.${SITE_DOMAIN} pihole.${BASE_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/lottage/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lottage/privkey.pem;

    # Docker's embedded DNS, with proxy_pass through a variable so the name is
    # resolved per request rather than at startup. Without it nginx refuses to
    # start whenever pihole is not already up, which is exactly when you want
    # the reverse proxy answering.
    resolver 127.0.0.11 valid=30s;
    set $pihole http://pihole:8080;

    location / {
        proxy_pass $pihole;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Both apexes, one server block: ${SITE_DOMAIN} is this site's index and
# ${BASE_DOMAIN} is the tree apex. They serve the same page deliberately —
# see the comment in base/landing/kustomization.yaml.
server {
    listen 8443 ssl;
    http2 on;
    server_name ${SITE_DOMAIN} ${BASE_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/lottage/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lottage/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
}
