# Lottage's dnsmasq directives, mounted at /etc/dnsmasq.d/site.conf beside the
# hydrated copy of base/dns/dnsmasq-base.conf. Same file, same role and same
# precedence rules as sites/<site>/infrastructure/site.conf at the other two
# sites: everything here overrides a wildcard in the base config, because more
# specific wins in dnsmasq.

# The node is a real host, not an ingress route. Without this the
# ${BASE_DOMAIN} catch-all sends it to nginx, which answers for the web ports
# and nothing else — and ssh would land on the reverse proxy.
#
# Named pi01, not k3s01: there is no k3s here. docs/naming-convention.md gives
# the role its own label.
address=/pi01.${SITE_DOMAIN}/${LOTTAGE_HOST_IP}
address=/udr.${SITE_DOMAIN}/${LAN_GATEWAY}

# The other two sites' subtrees, over the Site Magic VPN. The mirror of the
# lottage lines in their site.conf files; without these a browser here reaches
# their names on Lottage's own nginx and gets a certificate error, because a
# wildcard matches one label and grafana.akron.internal... is two down.
address=/${AKRON_SITE_DOMAIN}/${AKRON_TRAEFIK_IP}
address=/eastbank.${BASE_DOMAIN}/${EASTBANK_TRAEFIK_IP}
