---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: unpoller
      version: "~2.x"
      sourceRef:
        kind: HelmRepository
        name: unpoller
        namespace: monitoring
      interval: 12h
  values:
    podMonitor:
      enabled: false
    service:
      enabled: false
    dashboards:
      create: false
      grafana:
        create: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
