---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: unpoller
  namespace: monitoring
spec:
  podMetricsEndpoints:
    - port: tcp
      interval: 30s
      relabelings:
        - replacement: unpoller-lottage
          targetLabel: instance
        - replacement: lottage
          targetLabel: site
  selector:
    matchLabels:
      app.kubernetes.io/instance: unpoller-lottage
      app.kubernetes.io/name: unpoller
