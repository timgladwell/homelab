---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller-akron
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: unpoller
      version: "~2.x"
      sourceRef:
        kind: HelmRepository
        name: unpoller
        namespace: monitoring
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: unpoller-akron-config
      valuesKey: upConfig
      targetPath: upConfig
  values:
    podMonitor:
      enabled: true
      interval: 30s
      relabelings:
        - replacement: unpoller-akron
          targetLabel: instance

    service:
      enabled: false

    dashboards:
      create: false
      grafana:
        create: false

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
