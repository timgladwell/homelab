---
# Eastbank keeps Traefik/MetalLB (matches Akron's ingress pattern), but the
# shared pihole-secret's FTLCONF_dns_revServers/FTLCONF_misc_dnsmasq_lines
# are Akron-specific (local gateway IP, syslog forwarding that only exists
# on Akron) — patch them with Eastbank's own values.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../core
patches:
  - path: pihole-revservers-secret.sops.yaml
