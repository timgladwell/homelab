# Eastbank's complete, standalone pihole-secret - encrypt with SOPS before committing:
#   sops -e -i infrastructure/core-overlays/eastbank/pihole-secret.sops.yaml
#
# Deliberately NOT a Kustomize patch onto infrastructure/core/dns/pihole-secret.sops.yaml.
# Kustomize's stringData merge is field-level, but each SOPS-encrypted file has its own
# single `sops:` metadata block describing the whole document's encryption key — merging
# stringData from two separately-encrypted files leaves some fields whose ciphertext
# doesn't match the surviving `sops:` block, and Flux fails to decrypt them. This file
# replaces the base Secret entirely (see delete-pihole-secret.yaml) and must always
# contain every FTLCONF_* field the base has, not just the ones that differ from Akron.
