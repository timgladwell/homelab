---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "~87.21.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  values:
    grafana:
      enabled: true
      adminPassword: ""
      admin:
        existingSecret: grafana-secret
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 2Gi
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: false
      grafana.ini:
        analytics:
          reporting_enabled: false
          check_for_updates: false
        security:
          disable_gravatar: true
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        dashboards:
          enabled: true
          searchNamespace: ALL
        datasources:
          enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 768Mi

    prometheus:
      prometheusSpec:
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 7d
        retentionSize: 6GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 14Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 2Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
          # Drop the cgroup id label — full cgroup paths are not used in dashboards
          # and contribute disproportionately to series cardinality
          - action: labeldrop
            regex: id
          # Drop metric families not referenced by any configured dashboard
          - sourceLabels: [__name__]
            regex: "container_(tasks_state|cpu_load_average_10s|memory_failures_total|memory_mapped_file)"
            action: drop
          - sourceLabels: [__name__]
            regex: "container_(network_tcp_usage_total|network_udp_usage_total|blkio_device_usage_total)"
            action: drop
          - sourceLabels: [__name__]
            regex: "container_(fs_io_current|fs_io_time_seconds_total|fs_io_time_weighted_seconds_total)"
            action: drop
          - sourceLabels: [__name__]
            regex: "container_(fs_reads_merged_total|fs_sector_reads_total|fs_sector_writes_total)"
            action: drop
          - sourceLabels: [__name__]
            regex: container_fs_writes_merged_total
            action: drop

    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          # Drop histogram bucket series — these account for most apiserver cardinality.
          # _sum and _count are retained so average latency remains queryable;
          # percentile queries (histogram_quantile) will no longer work.
          - sourceLabels: [__name__]
            regex: "apiserver_(request_duration_seconds_bucket|response_sizes_bucket)"
            action: drop
          - sourceLabels: [__name__]
            regex: "apiserver_(watch_events_sizes_bucket|request_filter_duration_seconds_bucket)"
            action: drop

    nodeExporter:
      enabled: true
      serviceMonitor:
        relabelings:
          - sourceLabels: [__meta_kubernetes_node_name]
            targetLabel: instance

    kubeStateMetrics:
      enabled: true

    prometheusOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    kubeControllerManager:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeEtcd:
      enabled: false

    kubeProxy:
      enabled: false
