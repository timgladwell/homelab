---
# Per-site age keys: each site's Flux only holds its own private key, so a
# compromised/stolen remote device can't decrypt secrets belonging to other
# sites. See the on-device bootstrap doc for exact commands. Existing secret
# files must be re-encrypted with `sops updatekeys <file>` after this changes
# (does not happen retroactively).
creation_rules:
  # Every secret lives under sites/<site>/, so the site directory alone decides
  # which key encrypts it — no path-by-path exceptions to keep in sync.
  #
  # Note this is the *hosting* site, not the subject: the eastbank/lottage-named
  # secrets under sites/akron/monitoring/unpoller/ belong to Unpoller instances
  # that run centrally on Akron polling remote UniFi controllers, so they
  # correctly take Akron's key.
  - path_regex: ^sites/akron/.*secret\.sops\.yaml$
    age: age1wfqc89fy2a8l339nf2rlevclkkhjcy28jurdex6gpdjt8laa2sfqswl45d
    encrypted_regex: '^(data|stringData)$'
  - path_regex: ^sites/eastbank/.*secret\.sops\.yaml$
    age: age1yg55rt2u8q9tc4jrxa4ve4pg7aesa8vup83wlj6sxvyjqj2cqccqspgz4f
    encrypted_regex: '^(data|stringData)$'

  # Safety net for a secret added outside sites/ (base/ has none today, and
  # shouldn't — a secret in base/ is a site value in a site-agnostic tree).
  # Encrypted to every site key, since any site could reconcile it.
  - path_regex: .*secret\.sops\.yaml$
    age: >-
      age1wfqc89fy2a8l339nf2rlevclkkhjcy28jurdex6gpdjt8laa2sfqswl45d,
      age1yg55rt2u8q9tc4jrxa4ve4pg7aesa8vup83wlj6sxvyjqj2cqccqspgz4f
    encrypted_regex: '^(data|stringData)$'
