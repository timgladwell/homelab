---
# Per-site age keys: each site's Flux only holds its own private key, so a
# compromised/stolen remote device can't decrypt secrets belonging to other
# sites. Generate 2 more age keypairs (one per new site) and replace the
# CHANGEME placeholders below before merging — see the on-device bootstrap
# doc for exact commands. Existing secret files must be re-encrypted with
# `sops updatekeys <file>` after this changes (does not happen retroactively).
creation_rules:
  # Akron-only secrets (monitoring stack, UniFi poller credentials — Unpoller
  # runs centrally on Akron only, even for the eastbank/lottage-named
  # secret.sops.yaml files under infrastructure/akron-only/monitoring/unpoller/).
  - path_regex: infrastructure/akron-only/.*secret\.sops\.yaml$
    age: age1wfqc89fy2a8l339nf2rlevclkkhjcy28jurdex6gpdjt8laa2sfqswl45d
    encrypted_regex: '^(data|stringData)$'

  # Everything else matching *secret.sops.yaml (shared infra, e.g. PiHole) —
  # encrypted to all three site keys so any site's Flux can decrypt it.
  - path_regex: .*secret\.sops\.yaml$
    age: >-
      age1wfqc89fy2a8l339nf2rlevclkkhjcy28jurdex6gpdjt8laa2sfqswl45d,
      CHANGEME-eastbank-age-public-key,
      CHANGEME-lottage-age-public-key
    encrypted_regex: '^(data|stringData)$'
