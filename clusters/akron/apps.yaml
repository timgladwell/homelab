---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../sites/akron/apps
  prune: true
  wait: false  # Apps can fail without blocking reconciliation
  timeout: 5m
  # TODO - uncomment when infrastructure is ready
  dependsOn:  # Critical: apps only deploy after infrastructure is ready and MetalLB IPs are assigned
    - name: infrastructure
    - name: infrastructure-akron-only  # PodMonitor CRD (kube-prometheus-stack) needed by app PodMonitors
    - name: infrastructure-config
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
