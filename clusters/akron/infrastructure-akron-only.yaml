---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # NAME IS FROZEN. Renaming this object makes the flux-system Kustomization
  # prune the old one, which cascade-deletes everything it owns — including
  # the Prometheus/Loki/Grafana PVCs. The directory it points at is now
  # sites/akron/monitoring; the stale name is the cheap half of that trade.
  name: infrastructure-akron-only
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system  # References the GitRepository that Flux created during bootstrap
  path: ../sites/akron/monitoring
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
