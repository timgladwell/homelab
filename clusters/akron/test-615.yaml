---
# TEMPORARY(until: 2026-11-21, issue: #615): a Kustomization that fails on
# purpose (see sites/akron/test-615/), to confirm that Flux logs a failed
# reconcile with its revision. Nothing depends on it and it has no wait, so
# no other layer is held up. Akron only: clusters/akron/ isn't read elsewhere.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: test-615
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./sites/akron/test-615
  # Nothing is ever applied, so there is nothing to prune on removal.
  prune: true
