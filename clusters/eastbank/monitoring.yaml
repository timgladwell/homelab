---
# Metrics collection only — Eastbank ships to Akron's Prometheus rather than
# running its own, because it boots from an SD card and a Prometheus TSDB would
# wear it out. See base/metrics-collection/.
#
# dependsOn infrastructure so the DNS pods (and their unbound-exporter sidecar)
# exist before the collector goes looking for them. Nothing here needs a CRD
# beyond Flux's own.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./sites/eastbank/monitoring
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      # Estate-wide values first, this site's second — a later entry wins,
      # so a site could override a shared default if it ever had to.
      - kind: ConfigMap
        name: network-vars
      - kind: ConfigMap
        name: cluster-vars
