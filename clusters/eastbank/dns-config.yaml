---
# Configures PiHole's blocklists, groups and clients once PiHole is running.
# Separate from infrastructure-config because it needs different reconcile
# semantics, not because it lives in a different namespace: force: true to
# recreate the immutable sync Job when its ConfigMap hash changes, and a 20m
# timeout because a gravity rebuild takes ~10m (infrastructure-config uses 2m).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dns-config
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./sites/eastbank/dns-config
  prune: true
  # force allows Flux to delete and recreate the Job when its spec changes
  # (Jobs are immutable once created). This happens automatically whenever
  # pihole-config.yaml or sync.py changes, because the ConfigMap hash suffix
  # changes, which changes the volume reference in the Job spec.
  force: true
  wait: true
  # Gravity update takes ~10 minutes; 20 minutes provides enough headroom.
  timeout: 20m
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      # Estate-wide values first, this site's second — a later entry wins,
      # so a site could override a shared default if it ever had to.
      - kind: ConfigMap
        name: network-vars
      - kind: ConfigMap
        name: cluster-vars
