---
# The landing page and NetworkOptimizer. Its own Kustomization rather than a
# directory inside infrastructure because both need the Traefik IngressRoute
# CRD, which the infrastructure layer installs — the same ordering reason
# infrastructure-config exists.
#
# Also the right blast radius: nothing in the cluster depends on this layer, so
# a failure here leaves DNS, ingress, certificates and telemetry alone.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # Load-bearing: renaming prunes everything this owns, PVCs included.
  # See docs/runbooks/flux-kustomization-changes.md.
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./sites/eastbank/apps
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: infrastructure
  # Needed since the landing page: this layer now holds this site's copy of the
  # Pi-hole admin password.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      # Estate-wide values first, this site's second — a later entry wins,
      # so a site could override a shared default if it ever had to.
      - kind: ConfigMap
        name: network-vars
      - kind: ConfigMap
        name: cluster-vars
