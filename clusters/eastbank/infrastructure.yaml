---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system  # References the GitRepository that Flux created during bootstrap
  # Shared core, patched with Eastbank's own pihole-secret values (revServers,
  # dnsmasq_lines — Akron's are baked into the base and don't apply here)
  path: ../infrastructure/core-overlays/eastbank
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
