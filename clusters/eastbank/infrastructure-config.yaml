---
# Deploys MetalLB configuration (IPAddressPool + L2Advertisement).
# Runs after the infrastructure Kustomization so MetalLB CRDs are guaranteed
# to be installed before these resources are applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./sites/eastbank/infrastructure-config
  prune: true
  wait: true
  # 2m is shorter than a first DNS-01 issuance. base/cert-manager-config's
  # Certificate has a real Ready condition, so wait: true blocks on it, and
  # an ACME round trip plus a propagation check does not reliably finish
  # inside two minutes even when everything works — the layer reports a
  # health-check failure for a cert that is simply still issuing.
  #
  # Kept at wait: true deliberately: the two ClusterIssuers here also have
  # Ready conditions, and that is the signal that the Cloudflare secret
  # failed to decrypt or the ACME account cannot register. Worth gating on.
  timeout: 10m
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
