---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  # This site's own subtree. Named SITE_DOMAIN, not HOSTNAME, because since
  # #230 the node has a real host FQDN (k3s01.eastbank.internal.zerpzorp.com)
  # and the two are easy to confuse.
  SITE_DOMAIN: eastbank.internal.zerpzorp.com
  # MetalLB IP allocations - must be static IPs outside your router's DHCP range,
  # within your home network subnet (e.g. 192.168.1.x).
  METALLB_ADDRESS_RANGE: "10.4.1.10-10.4.1.99"
  METALLB_TRAEFIK_IP: "10.4.1.80"
  METALLB_PIHOLE_IP: "10.4.1.53"
  NODE_IP: "10.4.1.3"
  # PiHole's conditional forwarding: reverse lookups for this LAN go to the
  # gateway, so DHCP-assigned hostnames resolve. Composed into
  # FTLCONF_dns_revServers in base/dns/pihole-deployment.yaml, together with
  # SITE_DOMAIN — which must match the UniFi per-network "Domain Name" for
  # this site, or the gateway answers for a domain PiHole never asks about.
  LAN_CIDR: "10.4.0.0/16"
  LAN_GATEWAY: "10.4.1.1"
  SITE_NAME: eastbank
  # No PROMETHEUS_REMOTE_WRITE_URL or LOKI_PUSH_URL here, deliberately. This
  # site has no Prometheus or Loki of its own and takes the estate defaults
  # from clusters/common/network-vars.yaml, which point at Akron. Only Akron
  # overrides them, because only Akron has something local to write to.
