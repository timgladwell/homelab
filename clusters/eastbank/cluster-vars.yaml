---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  DNS_DOMAIN: home.arpa
  HOSTNAME: eastbank.home.arpa
  # MetalLB IP allocations - must be static IPs outside your router's DHCP range,
  # within your home network subnet (e.g. 192.168.1.x).
  METALLB_ADDRESS_RANGE: "10.4.1.10-10.4.1.99"
  METALLB_TRAEFIK_IP: "10.4.1.80"
  METALLB_PIHOLE_IP: "10.4.1.53"
  NODE_IP: "10.4.1.3"
  # Metrics are shipped to Akron — this site has no Prometheus of its own.
  # An IP, not a hostname, deliberately: nothing in the metrics path should
  # depend on cross-site DNS. 10.6.1.80 is Akron's Traefik LoadBalancer, which
  # routes only PathPrefix(`/api/v1/write`) through to Prometheus.
  SITE_NAME: eastbank
  PROMETHEUS_REMOTE_WRITE_URL: "http://10.6.1.80/api/v1/write"
