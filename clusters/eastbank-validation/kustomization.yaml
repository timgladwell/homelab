---
# Validation entry point for Eastbank's full cluster manifest.
# Used by scripts/validate/03-kustomize-build.sh only — not reconciled by Flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../eastbank                              # Flux bootstrap: controllers + Kustomization definitions
  - ../../sites/eastbank/infrastructure      # DNS, Traefik, MetalLB, system-upgrade-controller
  - ../../sites/eastbank/infrastructure-config  # Needs CRDs from the infrastructure layer
  - ../../sites/eastbank/app-config          # pihole-sync
