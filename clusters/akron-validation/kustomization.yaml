---
# Validation entry point for Akron's full cluster manifest.
# Used by scripts/validate/03-kustomize-build.sh only — not reconciled by Flux.
#
# One entry per Flux Kustomization this site reconciles. Components added
# under an existing sites/akron/<layer>/ are picked up automatically; a new
# top-level Flux Kustomization needs a line here and a check in
# scripts/validate/02-flux-build.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../akron                              # Flux bootstrap: controllers + Kustomization definitions
  - ../../sites/akron/infrastructure      # DNS, Traefik, MetalLB, system-upgrade-controller
  - ../../sites/akron/monitoring          # Akron-only: Prometheus, Grafana, Loki, Alloy, Unpoller
  - ../../sites/akron/infrastructure-config  # Needs CRDs from the infrastructure layer
  - ../../sites/akron/app-config          # pihole-sync
