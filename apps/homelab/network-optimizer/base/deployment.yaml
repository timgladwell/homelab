---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-optimizer
  namespace: apps
  annotations:
    # container-security-context-readonlyrootfilesystem: Blazor Server runtime writes
    #   ASP.NET temp files and logs outside /data; readOnlyRootFilesystem requires
    #   remapping all write paths upstream in the image.
    # container-security-context-user-group-id: Runtime UID/GID is managed internally
    #   by the image entrypoint; cannot set runAsUser/runAsGroup without inspecting
    #   the image to determine the correct values.
    # pod-probes-identical: /api/health is the only health endpoint exposed by the
    #   app; using different endpoints would require upstream changes.
    # pod-networkpolicy: No NetworkPolicy yet — pending a follow-up task.
    # deployment-replicas: Single replica is intentional; NetworkOptimizer is
    #   single-site per deployment and SQLite does not support concurrent writers.
    # container-image-pull-policy: Tag is pinned to a semver release; IfNotPresent
    #   avoids redundant pulls on an RPi with limited bandwidth.
    kube-score/ignore: >-
      container-security-context-readonlyrootfilesystem,container-security-context-user-group-id,pod-probes-identical,pod-networkpolicy,deployment-replicas,container-image-pull-policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-optimizer
  template:
    metadata:
      labels:
        app: network-optimizer
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: network-optimizer
          image: ghcr.io/ozark-connect/network-optimizer:1.17.12
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8042
              protocol: TCP
            - name: speedtest
              containerPort: 3005
              protocol: TCP
          env:
            - name: BIND_LOCALHOST_ONLY
              value: "false"
            - name: HOST_IP
              value: "${NODE_IP}"
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: network-optimizer
