---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-optimizer
  namespace: apps
  annotations:
    kube-score/ignore: >-
      container-security-context-readonlyrootfilesystem,container-security-context-user-group-id,pod-probes-identical,pod-networkpolicy,deployment-replicas,container-image-pull-policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-optimizer
  template:
    metadata:
      labels:
        app: network-optimizer
    spec:
      containers:
        - name: network-optimizer
          image: ozarkconnect/network-optimizer:1.16.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8042
              protocol: TCP
            - name: speedtest
              containerPort: 3005
              protocol: TCP
          env:
            - name: BIND_LOCALHOST_ONLY
              value: "false"
            - name: HOST_IP
              value: "${NODE_IP}"
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: network-optimizer
