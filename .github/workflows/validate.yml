---
name: Validate

# Every change to the manifests, from anyone — including Renovate and
# Dependabot, whose PRs never run the local pre-commit hooks.
on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main, stable]
  # Weekly, for the chart-source audit at the end of the job (#535): upstream
  # moves without a PR here, so nothing else would run it. Monday, after
  # Renovate's weekend run.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant. The event
# is in the key so a push to main never cancels the weekly audit.
concurrency:
  group: validate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so CI and a developer's machine reach the same verdict. Only
  # kustomize/kubeconform/kube-score/conftest are installed by hand — flux
  # and trivy have first-party setup actions, and there is no first-party
  # action for the other four.
  #
  # The `# renovate:` comments are what keeps these current — see the
  # customManagers entry in renovate.json. Dependabot cannot cover them:
  # its github-actions ecosystem bumps `uses:` refs, not version strings
  # in env vars or action inputs. extractVersion strips the upstream tag
  # down to the bare version these URLs interpolate.
  # kustomize tags as `kustomize/v5.8.1`; no trailing `$` here only to stay
  # inside yamllint's 120-column limit — anchoring the start is what matters.
  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)
  KUSTOMIZE_VERSION: 5.8.3
  # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
  KUBECONFORM_VERSION: 0.8.0
  # renovate: datasource=github-releases depName=zegl/kube-score extractVersion=^v(?<version>.+)$
  KUBE_SCORE_VERSION: 1.20.0
  # renovate: datasource=github-releases depName=open-policy-agent/conftest extractVersion=^v(?<version>.+)$
  CONFTEST_VERSION: 0.71.1
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: 1.38.0
  # Compiles the requirements*.in files, and checks their lockfiles
  # (step 17). Renovate runs it too, from the lockfile headers.
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.13.7
  # No ALLOY_VERSION pin: the manifests job derives it from the alloy chart.

# One job per group of scripts/validate-k3s.sh, so each installs only the tools
# its steps use and the three run in parallel. Promote to stable reads this
# workflow's overall conclusion, so every job still gates promotion.
jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pipx and python3 are preinstalled; step 09 needs only the stdlib.
      - run: pipx install "yamllint==${YAMLLINT_VERSION}"
      - run: ./scripts/validate-k3s.sh repo

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The minor the pods run: base/landing/deployment.yaml and
      # base/pihole-sync/sync-job.yaml both pin python:3.15.x. Also gives pip a
      # writable environment: the runner's system python is PEP 668
      # externally-managed (docs/runbooks/development-environment.md).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install tools
        run: |
          set -euo pipefail
          pipx install "uv==${UV_VERSION}"
          PYYAML_FORCE_LIBYAML=0 pip install --require-hashes -r requirements-dev.txt
      - run: ./scripts/validate-k3s.sh python

  manifests:
    runs-on: ubuntu-latest
    # A full run takes under a minute. Without this, a hang runs to GitHub's
    # 6-hour default before anyone is told; step 15 has hung once already.
    # Room for the five download steps' 7-minute caps (see "Retry transient
    # download failures") to all run slow and still finish.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # GitHub release downloads intermittently 504 or hang (run 42464077746
      # failed six attempts in a row on them). Every curl in this job reads
      # ~/.curlrc, including the ones inside the flux and flate actions, which
      # can't be given flags.
      #
      # - retry: only transient failures (timeouts, 408, 429, 5xx), never a
      #   404, backing off 1s, 2s, 4s… with no new try after retry-max-time.
      # - speed-limit/speed-time and connect-timeout end a hung attempt:
      #   retry-max-time never interrupts one in flight, and two stalled tries
      #   once stretched a single call to 9 minutes. A stall check, not
      #   max-time, so the 169MB alloy zip isn't cut off on a slow link.
      #
      # That bounds one curl call to ~5.5 minutes. The actions wrap curl in
      # loops of their own, so each step that downloads also carries
      # timeout-minutes: 7, the hard cap. The budget is long on purpose: a slow
      # run beats a red one, since promotion waits on a green run on main.
      - name: Retry transient download failures
        run: |
          printf '%s\n' 'retry = 9' 'retry-max-time = 300' 'connect-timeout = 10' \
            'speed-limit = 1024' 'speed-time = 30' >> "$HOME/.curlrc"

      # Step 12 must validate with the Alloy the clusters run, which is the
      # alloy chart's appVersion. The chart's version is a patch range, so a
      # pin here lagged every chart patch that floated in without a PR (#537).
      # Resolving the HelmReleases' range the way Flux does leaves one version
      # to keep current. It can run ahead of a cluster by up to the chart's
      # 12h fetch interval, never behind. helm is preinstalled on the runner.
      - name: Resolve Alloy version from the alloy chart
        timeout-minutes: 7
        run: |
          set -euo pipefail
          ranges=$(grep -h -A3 'chart: alloy$' \
              base/collector/collector.yaml base/collector/node-log-reader.yaml \
            | sed -n 's/^ *version: "\(.*\)"$/\1/p' | sort -u)
          # Two releases, one binary to validate both: they must agree.
          if [[ $(wc -l <<< "$ranges") -ne 1 || -z "$ranges" ]]; then
            echo "::error::alloy HelmReleases disagree on chart version: ${ranges//$'\n'/, }"
            exit 1
          fi
          # helm has no retry flag; same backoff as ~/.curlrc above.
          for delay in 1 2 4 8 16 32 64 128 fail; do
            if app=$(helm show chart alloy --repo https://grafana.github.io/helm-charts --version "$ranges" \
                | sed -n 's/^appVersion: v//p'); then
              break
            fi
            [[ $delay == fail ]] && exit 1
            echo "helm show chart failed, retrying in ${delay}s"
            sleep "$delay"
          done
          echo "alloy chart $ranges deploys Alloy $app"
          echo "ALLOY_VERSION=$app" >> "$GITHUB_ENV"

      # For substitute.py (step 3) and chart_sources.py (step 15), at the minor
      # the python job tests them on. Also gives pip a writable environment:
      # the runner's system python is PEP 668 externally-managed, so installing
      # into it needs --break-system-packages, which leaves an interpreter in a
      # state no file here describes; a last resort
      # (docs/runbooks/development-environment.md).
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      # Pinned to the version the clusters run (clusters/*/flux-system/), not
      # the newest release: CI should build the way the clusters will. Bump
      # this in the same PR that upgrades Flux — see docs/runbooks/flux-upgrades.md.
      # Deliberately carries no `# renovate:` comment: an automated bump to the
      # newest Flux would be the one wrong answer here.
      - name: Setup Flux CLI
        timeout-minutes: 7
        uses: fluxcd/flux2/action@main
        with:
          version: 2.10.0

      # Renders every HelmRelease for step 15. The action installs the flate
      # release matching its own tag, so the `uses:` ref is the only pin, and
      # Dependabot's github-actions ecosystem keeps it current. Like alloy, it
      # only has to be new enough to render the charts.
      #
      # `cache: true` restores flate's chart and source cache across runs, so
      # step 15 only downloads a chart the first time a PR changes its version.
      # The action keeps it under $RUNNER_TEMP, outside the checkout, which
      # matters: step 6 runs trivy over ./ and would scan cached charts as if
      # they were this repo's IaC.
      - name: Setup flate
        timeout-minutes: 7
        uses: home-operations/flate/action@v0.7.3
        with:
          cache: true

      - name: Setup Trivy
        timeout-minutes: 7
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2

      - name: Install remaining tools
        timeout-minutes: 7
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cd "$(mktemp -d)"

          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz kustomize && mv kustomize "$HOME/.local/bin/"

          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform && mv kubeconform "$HOME/.local/bin/"

          curl -fsSL -o kube-score.tar.gz \
            "https://github.com/zegl/kube-score/releases/download/v${KUBE_SCORE_VERSION}/kube-score_${KUBE_SCORE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kube-score.tar.gz kube-score && mv kube-score "$HOME/.local/bin/"

          curl -fsSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest && mv conftest "$HOME/.local/bin/"

          curl -fsSL -o alloy.zip \
            "https://github.com/grafana/alloy/releases/download/v${ALLOY_VERSION}/alloy-linux-amd64.zip"
          unzip -q alloy.zip && mv alloy-linux-amd64 "$HOME/.local/bin/alloy"
          chmod +x "$HOME/.local/bin/alloy"

          # Libraries, not applications, so they go into the environment
          # substitute.py actually runs in rather than a pipx venv.
          PYYAML_FORCE_LIBYAML=0 pip install --require-hashes -r "$GITHUB_WORKSPACE/requirements-dev.txt"

      - name: Tool versions
        run: |
          flux version --client
          kustomize version
          kubeconform -v
          kube-score version
          trivy --version | head -1
          conftest --version | head -1
          alloy --version | head -1
          flate --version
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      # No age key and no cluster: `flux build --dry-run` does not decrypt, and
      # every step reads the repo rather than a live cluster. If a step ever
      # starts needing a secret, that is a bug in the step, not a missing
      # repository secret here.
      - name: Validate
        env:
          K3S_BUILD_DIR: ${{ runner.temp }}/k3s-build
        run: ./scripts/validate-k3s.sh manifests

      # Whether each chart source still moves its app: redirects, frozen
      # sources, deprecated charts, Renovate pins without release notes. See
      # scripts/chart_sources.py. Weekly rather than per PR, because what it
      # finds changes upstream, not in a diff. Runs even when Validate failed,
      # and fails itself if Validate left nothing to read. A failure here
      # emails the repo owner, which is the alert; each finding becomes an
      # issue, as #531 and #534 did.
      - name: Audit chart sources
        if: >-
          always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          K3S_BUILD_DIR: ${{ runner.temp }}/k3s-build
        run: python3 scripts/chart_sources.py audit "$K3S_BUILD_DIR"
