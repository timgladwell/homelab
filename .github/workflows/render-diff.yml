---
name: Render diff

# Comments on each pull request with what it changes in the rendered
# manifests, per site — see .github/scripts/render-diff.sh. A review aid, so it lives
# apart from Validate: it cannot fail a PR, and it is the only workflow that
# needs to write to one.
on:  # yamllint disable-line rule:truthy
  pull_request:

concurrency:
  group: render-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  render-diff:
    runs-on: ubuntu-latest
    # Seconds normally. Bounds a stalled chart fetch well short of GitHub's
    # 6-hour default, as Validate does. Room for Setup flate's 7-minute cap.
    timeout-minutes: 15
    steps:
      # Full history, so the base branch is there to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same as Validate's step of this name, which explains it and the
      # timeout-minutes on Setup flate: flate's download is curl, and GitHub
      # release downloads intermittently 504 or hang. Keep the two in step.
      - name: Retry transient download failures
        run: |
          printf '%s\n' 'retry = 9' 'retry-max-time = 300' 'connect-timeout = 10' \
            'speed-limit = 1024' 'speed-time = 30' >> "$HOME/.curlrc"

      # Same pin and cache as Validate. `base` is exported as FLATE_BASE, which
      # the script unsets: it diffs two prepared checkouts with -P instead.
      - name: Setup flate
        timeout-minutes: 7
        uses: home-operations/flate/action@v0.6.5
        with:
          base: origin/${{ github.base_ref }}
          cache: true

      # Diffs against the merge commit's first parent, the base it was built
      # on, not origin/<base>: a re-run reuses the original merge commit while
      # the fetch brings today's base, so every later merge to main showed up
      # in the diff, reversed (#636's re-run, 2026-11-09).
      - name: Render diff
        run: |
          ./.github/scripts/render-diff.sh "$(git rev-parse --short HEAD^1)" > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      # Updates one comment in place rather than adding one per push, found by
      # the marker the script writes on its first line. Posts a new comment
      # only when there is something to show, so a PR that changes no manifest
      # gets no comment at all.
      #
      # Skipped for forks, whose GITHUB_TOKEN is read-only whatever
      # `permissions:` says; the job summary above still has the diff.
      # Dependabot's PRs default to read-only too, but GitHub honours the
      # `permissions:` block above for them (changelog 2021-10-06), so they
      # get the comment.
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/body.md"
          # GitHub rejects comments over 65,536 characters. The job summary
          # keeps the whole diff, so a long one is cut here and linked.
          if [[ $(wc -c < "$body") -gt 60000 ]]; then
            head -c 60000 "$body" > "$body.cut"
            printf '\n\n…truncated. The full diff is in the [job summary](%s).\n' "$RUN_URL" >> "$body.cut"
            mv "$body.cut" "$body"
          fi

          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]")
                      | select(.body | startswith("<!-- flate-render-diff -->")) | .id' | tail -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@"$body" > /dev/null
          elif grep -q '^@@ ' "$body"; then
            gh pr comment "$PR" --body-file "$body"
          fi
