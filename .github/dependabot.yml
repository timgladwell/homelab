---
version: 2
updates:
  # Container images pinned directly in manifests: pihole, unbound,
  # unbound-exporter, python (pihole-sync Job and the landing page),
  # system-upgrade-controller.
  # Dependabot's docker ecosystem reads `image: repo:tag` fields out of
  # Kubernetes YAML, and these are covered here and nowhere else. Renovate
  # (renovate.json) covers what Dependabot can't see: Helm chart versions, and
  # versions pinned outside an `image:` field (the k3s Plans' `version:`, the
  # kubectl env var, image tags in HelmRelease values) through `# renovate:`
  # comments. The one image both could see is ignored below, so they never
  # propose the same bump.
  #
  # clusters/*/flux-system is deliberately NOT listed: those are Flux's own
  # controller images, upgraded via the Flux CLI (docs/runbooks/flux-upgrades.md).
  # Letting Dependabot bump them would fight the bootstrap process.
  #
  # This list is enforced by scripts/validate/repo/09-dependabot-coverage.sh, which
  # fails if any directory gains a pinned image without being listed. That check
  # exists because this config silently went stale once when directories moved,
  # and nobody noticed Dependabot had stopped covering most of the repo.
  #
  # Python's beta tags (`3.15.0b4`, no separator before the `b`) don't parse as
  # prereleases here, so each one arrives as an ordinary bump during CPython's
  # May–October beta season. Close those PRs by hand (as #202 was). There is no
  # prerelease syntax for docker in `ignore`, and blocking python minor bumps
  # would also block the stable release. Upstream: dependabot-core #15154,
  # #9496, #2692.
  - package-ecosystem: docker
    directories:
      - "/base/dns"
      - "/base/landing"
      - "/base/pihole-sync"
      - "/base/system-upgrade-controller"
      - "/sites/eastbank/apps"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Renovate owns the system-upgrade-controller Plans' k3s-upgrade image: it
    # has to move in one PR with the Plans' `version:`, which Dependabot can't
    # see (renovate.json's `k3s` group; #705).
    ignore:
      - dependency-name: "rancher/k3s-upgrade"

  - package-ecosystem: github-actions
    directories:
      - "/**"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
