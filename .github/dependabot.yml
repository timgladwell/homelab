---
# Only GitHub Actions. The docker ecosystem block was removed: it pointed at
# eight directories that no longer exist, and Dependabot's docker updater reads
# Dockerfiles and compose files, not Kubernetes manifests, so it was never
# updating any image in this repo. Helm chart versions are Renovate's job
# (see renovate.json); container image tags in manifests are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/**"
    schedule:
      interval: weekly
