# The two apexes, one router.
#
# ${SITE_DOMAIN} is this site's index; ${BASE_DOMAIN} is the tree apex, which
# resolves to whichever site the client is standing in
# (base/dns/dnsmasq-base.conf answers both with this site's Traefik). They
# serve the same page deliberately — see the comment in kustomization.yaml.
#
# Both names are already on the wildcard certificate: *.${BASE_DOMAIN} covers
# ${SITE_DOMAIN}, and the bare ${BASE_DOMAIN} is listed explicitly because no
# wildcard covers a bare name. base/cert-manager-config/certificate.yaml
# anticipated this page in its comments; nothing there needs changing.
#
# `Host(a) || Host(b)`, never `Host(a, b)`. Traefik v3 removed multi-value
# matchers and a v2-style rule does not fail loudly — the router is silently
# not created and every request gets Traefik's own 404, which looks exactly
# like a backend problem. policy/traefik_rule_matchers.rego fails the build
# on it.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: landing
  namespace: landing
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${SITE_DOMAIN}`) || Host(`${BASE_DOMAIN}`)
      kind: Rule
      services:
        - name: landing
          port: 80
  tls: {}
