---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Report drift, never correct it — see the reasoning in
  # base/metrics-collection/kube-state-metrics.yaml.
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 12h

  values:
    crds:
      enabled: true
      keep: true

    # DNS-01 propagation checks must not go through the site's own PiHole:
    # once PiHole becomes authoritative for internal.zerpzorp.com (iteration
    # 4 of #228), it answers _acme-challenge TXT queries with NODATA instead
    # of forwarding them, and cert-manager's self-check would hang forever
    # waiting for a record that will never appear from that resolver. Forcing
    # public recursive resolvers here means the behaviour is already correct
    # when that lands, instead of surfacing as a mystery regression then.
    #
    # This covers the shared apex as much as the site subtree. Every site's
    # Certificate carries internal.zerpzorp.com and *.internal.zerpzorp.com
    # (see base/cert-manager-config/certificate.yaml for why), and every
    # site's PiHole will be authoritative for that apex, so without this
    # flag the apex challenge is the one that hangs first.
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    # Steady state is ~1m of CPU each; these ceilings are insurance for the
    # startup burst, not for the running cost.
    #
    # Measured from process_cpu_seconds_total once #365 made cert-manager's own
    # metrics available (2026-09-21, v1.21.2, both sites): webhook ~1m,
    # controller ~1.5m, cainjector ~2m. Against a 250m ceiling that is 250x
    # headroom, and a healthy webhook throttles 0% of CFS periods.
    #
    # The burst is real though, and it is why the ceiling is not dropped back.
    # Freshly created pods throttle 7-22% of periods in their first scrape
    # window and 0% after, so startup genuinely touches the limit for a few
    # seconds while it lists, watches, and generates a serving certificate.
    # Requests stay at 20m and limits reserve nothing, so this ceiling costs
    # the node exactly nothing while unused -- there is no saving available by
    # lowering it, only the reintroduction of a failure that has taken
    # infrastructure-config down twice.
    #
    # That failure: every admission of a cert-manager CR goes through the
    # webhook, so a webhook too slow to answer takes the whole layer with it.
    # ClusterIssuer and Certificate dry-runs fail with "failed calling webhook
    # ... context deadline exceeded" and the layer never reconciles.
    #
    # Raise the ceiling rather than relaxing the probes, if it ever comes to
    # that again. The apiserver's own admission call carries timeout=30s and
    # blew through it during #323, so a wider probe window buys a webhook that
    # stays alive while still being too slow to admit anything -- the worse
    # failure, because then nothing restarts and nothing alerts.
    #
    # What this comment used to say, and why it was wrong, because it misled
    # two investigations:
    #
    #   - "The webhook and cainjector cache Secrets cluster-wide." They do not.
    #     On v1.21 the webhook watches exactly one Secret, with a field
    #     selector visible in its own logs:
    #       /api/v1/namespaces/cert-manager/secrets
    #         ?fieldSelector=metadata.name%3Dcert-manager-webhook-ca
    #     and cainjector watches PartialObjectMetadata, which is metadata only.
    #     So the cluster's total Secret volume does not size either one, and
    #     #364 wasted time comparing Secret counts between sites before reading
    #     that URL.
    #
    #   - "A cold cache burst caused the 2026-09-04 crash loop, so 100m was too
    #     small." It did not. That crash loop was a goroutine/timer leak in
    #     v1.21.1, fixed upstream in v1.21.2 (#357). The 100m -> 250m raise in
    #     #323 bought 17 days by making each cycle survive ten minutes instead
    #     of failing immediately, which read as a fix at the time. See #323 for
    #     the full post-mortem.
    #
    # To check any of this in future, read the process, not the container.
    # process_cpu_seconds_total and go_goroutines come from cert-manager itself
    # and say what it is doing; `kubectl top` reports the quota being enforced
    # rather than demand, and cAdvisor's working set differs 2x between these
    # two sites even when both are healthy and their Go heaps are within 10%.
    # Both of those were read as signal during #323 and neither was.
    webhook:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 64Mi

    cainjector:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 64Mi

    # startupapicheck is a Helm-hook Job (webhook readiness probe on install/
    # upgrade), not a Deployment — it doesn't inherit the top-level
    # `resources:` value above and needs its own, or the namespace
    # ResourceQuota rejects it outright:
    #   forbidden: failed quota: cert-manager: must specify limits.cpu ...
    startupapicheck:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
