---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Report drift, never correct it — see the reasoning in
  # base/metrics-collection/kube-state-metrics.yaml.
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 12h

  values:
    crds:
      enabled: true
      keep: true

    # DNS-01 propagation checks must not go through the site's own PiHole:
    # once PiHole becomes authoritative for internal.zerpzorp.com (iteration
    # 4 of #228), it answers _acme-challenge TXT queries with NODATA instead
    # of forwarding them, and cert-manager's self-check would hang forever
    # waiting for a record that will never appear from that resolver. Forcing
    # public recursive resolvers here means the behaviour is already correct
    # when that lands, instead of surfacing as a mystery regression then.
    #
    # This covers the shared apex as much as the site subtree. Every site's
    # Certificate carries internal.zerpzorp.com and *.internal.zerpzorp.com
    # (see base/cert-manager-config/certificate.yaml for why), and every
    # site's PiHole will be authoritative for that apex, so without this
    # flag the apex challenge is the one that hangs first.
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    # The memory limits are sized to hold each binary's page cache, not just
    # the process. The webhook binary is 57.9MB and the process ~12-15MB of
    # anon, ~70MB against the 64Mi (67.1MB) limit this used to have. Linux
    # charges a page-cache page to the cgroup that first read it in, so
    # whether a pod pays for its own binary depends on page-cache history.
    # When it does, the container sits at its limit and direct-reclaims its
    # own executable (Akron, 2026-09-25: pgscan_direct ~340/s, file refaults
    # ~170/s). That reclaim is kernel time billed to the CPU quota, so the
    # process throttles while doing no more work than usual, /livez misses
    # its 1s timeout, and the kubelet kills it. Every admission of a
    # cert-manager CR goes through the webhook, so Flux's ClusterIssuer and
    # Certificate dry-runs fail with "failed calling webhook ... context
    # deadline exceeded" and infrastructure-config goes down with it.
    #
    # Worst case over 5 days, page cache + RSS: webhook 72.2MB (Akron) and
    # 68.8MB (Eastbank), both over 64Mi; cainjector 64.4MB (Akron, 96%);
    # controller 99.7MB of its 128Mi. Hence 128Mi for all three. Requests are
    # unchanged: page cache is reclaimable, so nothing needs reserving, and
    # limits reserve no capacity. Measurements and the diagnostic steps are
    # in #375.
    #
    # A fresh pod clears it (rollout restart), which is what made two earlier
    # diagnoses look right: v1.21.2 "fixed a leak" only by creating a new pod,
    # and the 100m -> 250m CPU raise gave the reclaim more room without
    # removing it. Probes stay as they are: a 1s probe failing on a webhook
    # too slow to admit anything is the detector, not the disease.
    #
    # CPU: steady state is ~1-2m per component; freshly created pods throttle
    # 7-22% of periods in their first scrape window at 250m and 0% after
    # (2026-09-21). Whether 250m is needed now that the throttling it answered
    # turned out to be reclaim is open in #375.
    #
    # Read the cgroup, not the process or `kubectl top`. The Go heap and
    # goroutine counts were identical at both sites throughout; the difference
    # was only visible in the pod cgroup's memory.stat (file, pgscan_direct,
    # workingset_refault_file) against memory.max:
    #   U=$(kubectl -n cert-manager get pod \
    #        -l app.kubernetes.io/component=webhook \
    #        -o jsonpath='{.items[0].metadata.uid}')
    #   D=$(sudo find /sys/fs/cgroup -type d -name "*${U//-/_}*" | head -1)
    #   sudo grep -E '^(anon|file|pgscan_direct|workingset_refault_file) ' \
    #     $D/memory.stat; sudo cat $D/memory.current $D/memory.max
    webhook:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi

    cainjector:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi

    # startupapicheck is a Helm-hook Job (webhook readiness probe on install/
    # upgrade), not a Deployment — it doesn't inherit the top-level
    # `resources:` value above and needs its own, or the namespace
    # ResourceQuota rejects it outright:
    #   forbidden: failed quota: cert-manager: must specify limits.cpu ...
    startupapicheck:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
