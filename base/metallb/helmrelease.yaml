---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  # Report drift, never correct it — see the reasoning in
  # base/metrics-collection/kube-state-metrics.yaml.
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # We only use L2Advertisement (see base/metallb-config/), never BGP, so
    # the frr-k8s BGP daemon set is dead weight on the RPi — and it ships
    # with no resource requests/limits, which would break a ResourceQuota.
    frrk8s:
      enabled: false
    # Resource limits appropriate for RPi 4B
    controller:
      # The chart runs this as UID 65534 but leaves the group at 0 and sets no
      # seccomp profile. The speaker gets neither: it needs hostNetwork and
      # NET_RAW to answer ARP for the LoadBalancer IPs, which is L2 mode
      # working as designed.
      securityContext:
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    speaker:
      # The last finding from the #263 audit at either site. hostNetwork and
      # NET_RAW stay — answering ARP for the LoadBalancer IPs on the node's real
      # interface is L2 mode working as designed, and both are accepted in
      # docs/trivy-accepted-findings.txt. seccomp is a different axis: it filters
      # syscalls, not capabilities, and RuntimeDefault permits the AF_PACKET
      # sockets the speaker opens. The controller got this in #265; the speaker
      # was left out because its other findings looked inherent, which this one
      # is not.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
