---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # We only use L2Advertisement (see base/metallb-config/), never BGP, so
    # the frr-k8s BGP daemon set is dead weight on the RPi — and it ships
    # with no resource requests/limits, which would break a ResourceQuota.
    frrk8s:
      enabled: false
    # Resource limits appropriate for RPi 4B
    controller:
      # The chart runs this as UID 65534 but leaves the group at 0 and sets no
      # seccomp profile. The speaker gets neither: it needs hostNetwork and
      # NET_RAW to answer ARP for the LoadBalancer IPs, which is L2 mode
      # working as designed.
      securityContext:
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    speaker:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
