# Traefik dashboard IngressRoute
#
# Routes:
# - https://traefik.${SITE_DOMAIN}/dashboard/ -> dashboard UI
# - https://traefik.${SITE_DOMAIN}/api/*      -> dashboard API
# - https://traefik.${BASE_DOMAIN}/...        -> the same, at whichever site you are in
# Two hosts, one router. The site-qualified name always works from anywhere;
# the bare one is the site-local name — it resolves to whichever site the client
# is standing in (base/dns/dnsmasq-base.conf) and has to be matched here, or it
# resolves perfectly, presents a valid certificate, and 404s.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.${SITE_DOMAIN}`, `traefik.${BASE_DOMAIN}`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
  tls: {}
