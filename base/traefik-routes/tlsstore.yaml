# The default certificate for every TLS route at this site.
#
# Traefik looks for a TLSStore named exactly `default`; there is no way to
# point a route at a differently-named store implicitly. With this in place an
# IngressRoute needs only `tls: {}` and never names a Secret, so adding an app
# means adding a route and nothing else.
#
# Lives in the traefik namespace because that is where cert-manager writes the
# wildcard Secret (base/cert-manager-config/certificate.yaml chose that
# namespace for exactly this reason) — the store and the Secret it names must
# be in the same namespace.
#
# Without a defaultCertificate Traefik serves its own self-signed cert on
# websecure, which is a working handshake and a browser warning — a failure
# mode that looks like TLS is fine until someone reads the padlock.
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: internal-wildcard-tls
