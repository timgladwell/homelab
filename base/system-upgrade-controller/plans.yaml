---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  # ASSUMES(single-node): cordoning the only node leaves the upgrade job nowhere
  # to schedule. With a second node, cordon and drain so its pods move first.
  cordon: false
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  # An upgrade pod left Unknown/255 beside a Completed retry is usually
  # expected: docs/runbooks/k3s-upgrade-pod-unknown.md confirms it.
  upgrade:
    # The job runs privileged and replaces the k3s binary, so its image is
    # pinned by digest. The tag must be `version:` below with `+` as `-`: the
    # controller marks the Plan done at `version:` whatever the image installs.
    # Renovate bumps both in one PR; policy/k3s_upgrade_plan_image.rego fails
    # a Plan where they differ (#705).
    # renovate: datasource=docker depName=rancher/k3s-upgrade
    image: rancher/k3s-upgrade:v1.37.2-k3s1@sha256:69b48cf32cf51ed23ed86348fc913db1e00d1ddc00369ded18953dcad859a6e1
  # Pinned rather than `channel:` on purpose. A channel is resolved inside the
  # cluster at upgrade time, so the Kubernetes version never appears in git —
  # neither Renovate nor Dependabot can see it, and both boxes could cross a
  # minor unattended. That turned "is this Flux release supported?" into an SSH
  # question during the v2.9 upgrade. Pinned, it is a grep.
  #
  # Renovate opens a PR per k3s release (see renovate.json); Akron takes it on
  # merge to main, Eastbank only on promotion to stable, so the canary holds.
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.37.2+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  # ASSUMES(single-node): as in server-plan above. No agent node exists yet, so
  # this plan has never run.
  cordon: false
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    args:
      - prepare
      - server-plan
    # Pinned as in server-plan above.
    # renovate: datasource=docker depName=rancher/k3s-upgrade
    image: rancher/k3s-upgrade:v1.37.2-k3s1@sha256:69b48cf32cf51ed23ed86348fc913db1e00d1ddc00369ded18953dcad859a6e1
  serviceAccountName: system-upgrade
  upgrade:
    # renovate: datasource=docker depName=rancher/k3s-upgrade
    image: rancher/k3s-upgrade:v1.37.2-k3s1@sha256:69b48cf32cf51ed23ed86348fc913db1e00d1ddc00369ded18953dcad859a6e1
  # Keep in lockstep with server-plan above — see the rationale there.
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.37.2+k3s1
