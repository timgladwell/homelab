---
# The site's syslog address (ADR 0009): UDP straight to the collector on its
# own MetalLB IP, not through Traefik, which would replace the device's address
# with its own. externalTrafficPolicy: Local is what keeps that address; every
# syslog receiver falls back on it for `host`.
#
# No ports here. Each sender's Component (base/<sender>-syslog) patches its own
# onto this Service and adds its own Alloy file, so a new sender touches no
# other sender's files. A site lists base/syslog first, then its senders. A
# sender listed without it fails the build, because its patch has no target.
# base/syslog listed with no sender renders a Service with no ports, which the
# API server rejects. Ports in use are found with
# `git grep -n 'port: 15' -- 'base/*-syslog'`.
#
# ASSUMES(single-node): Local drops packets that land on a node with no
# collector pod, silently, because UDP has no handshake. Before adding a node,
# confirm MetalLB L2 announces this IP only from the collector's node.
#
# Both selector labels are required. The chart labels every pod
# `app.kubernetes.io/name: alloy`, the node log reader's included, and a
# Service matching both once sent half of every UDR's stream to a pod with no
# listener, silently: UDP has no handshake to fail. `instance` is the release
# name, so renaming the collector HelmRelease breaks this Service.
#
# The UniFi consoles send to syslog.internal.zerpzorp.com through A records of
# their own (docs/current-state/host-state.md, *UDR DNS records*), so changing
# METALLB_SYSLOG_IP means editing those records too.
#
# kube-score's service-targets-pod check wants the senders' ports declared on
# the container. The chart declares only extraPorts, which would also put them
# on the collector's ClusterIP Service; nothing in the cluster sends syslog.
apiVersion: v1
kind: Service
metadata:
  name: collector-syslog
  namespace: monitoring
  annotations:
    metallb.universe.tf/loadBalancerIPs: "${METALLB_SYSLOG_IP}"
    kube-score/ignore: service-targets-pod
spec:
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: collector
  type: LoadBalancer
  externalTrafficPolicy: Local
