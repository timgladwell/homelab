---
# Global PiHole config: groups, allow/block domains, and blocklists — identical
# on every site, which is why it lives in base/.
#
# Client definitions (and therefore client-to-group mapping) are site-specific
# and live in sites/<site>/dns-config/pihole-clients.yaml, merged into the same
# generated ConfigMap. sync.py requires that file to exist.
groups:
  # Additional allow-list configurations for streaming devices.
  - name: Streaming Device Addons
  # Clients who want relaxed adblocking.
  - name: Browser Adblock Only Clients

allow_domains:
  - domain: tags.tiqcdn.com
    comment: Otherwise Paramount Plus doesn't remember where you left off
    groups:
      - Streaming Device Addons

block_domains: []

allow_lists:
  - url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/whitelist-referral-native.txt
    comment: So you can click on links like Google ads and link shorteners
    groups:
      - Default
      - Browser Adblock Only Clients

