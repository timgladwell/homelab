# infrastructure/traefik/helmrelease.yaml
#
# Routing strategy:
# - Each app uses subdomain-based routing: https://<app>.${SITE_DOMAIN}
# - Standard ports only (80/443) - no custom ports to remember
# - Plain HTTP is redirected to HTTPS at the entry point, so no route opts out
#
# Traefik dashboard route:
# - https://traefik.${SITE_DOMAIN}/dashboard/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Report drift, never correct it — see the reasoning in
  # base/metrics-collection/kube-state-metrics.yaml.
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: traefik
      version: "41.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h

  values:
    # Resource limits appropriate for RPi 4B
    # Traefik v3 startup allocations exceed 135Mi (GOMEMLIMIT at 90% of 150Mi),
    # causing the Go runtime to be killed before logging initialises → silent crash.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

    # Stable external IP provided by MetalLB - no hostNetwork needed.
    # The fixed IP survives pod restarts so DNS/bookmarks don't need updating.
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: "${METALLB_TRAEFIK_IP}"

    # Single replica (homelab constraints).
    # RollingUpdate is now safe: old pod keeps accepting traffic until the new
    # pod passes its readiness probe, so there is no gap in HTTP/HTTPS routing.
    deployment:
      replicas: 1
      strategy:
        type: RollingUpdate

    # Disable built-in dashboard IngressRoute - we'll create our own
    # This gives us full control over routing and middleware
    ingressRoute:
      dashboard:
        enabled: false

    # Define entry points - standard ports only
    ports:
      web:
        port: 8000
        exposedPort: 80
        protocol: TCP
        # Global redirect to HTTPS. Deliberately at the entry point rather
        # than per-route: a route that forgot the middleware would silently
        # keep serving plaintext, and the whole point is that there is no
        # plaintext left.
        #
        # This is what forced the telemetry cutover into the same PR (#228
        # trap 3): a 308 mid-stream is not something to gamble remote-write
        # on, so both alloy endpoints moved to https at the same moment.
        #
        # Not `redirectTo:`. That key does not exist in this chart and Helm
        # would have accepted it silently — the pipeline does not render
        # charts (#213), so it fails on the cluster, as plaintext that is
        # never redirected. Verified against 41.2.0 with `helm template`.
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 8443
        exposedPort: 443
        protocol: TCP
      traefik:
        port: 9000
        expose:
          default: false  # Dashboard accessed via web entrypoint, not dedicated port
        protocol: TCP

    # Enable Kubernetes CRD and Ingress providers
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false

    additionalArguments:
      - "--api.insecure=true"  # Enable dashboard API (internal network only)
      - "--providers.kubernetesingress.ingressclass=traefik"

    # Logging for troubleshooting
    log:
      level: INFO
    accessLog:
      enabled: true
