---
# Traefik's own custom resources (IngressRoute, Middleware, TLSStore) go in
# base/traefik-routes/, never here. This Kustomization ships with the
# HelmRelease that installs their CRDs, so a CR here applies on a cluster that
# already has Traefik and fails on a fresh one with `no matches for kind`.
# Validation step 11 enforces it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - resourcequota.yaml
  - helmrepository.yaml
  - helmrelease.yaml
