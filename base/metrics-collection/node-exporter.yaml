---
# Host metrics. Deployed standalone rather than as part of kube-prometheus-stack
# so that both sites run the identical exporter — Eastbank has no Prometheus
# operator, and Akron's stack no longer scrapes anything itself.
#
# serviceMonitor is off deliberately: Eastbank has no ServiceMonitor CRD, and on
# Akron the collector discovers this DaemonSet directly. See alloy-metrics.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-node-exporter
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Report drift, never correct it — see the reasoning in
  # base/metrics-collection/kube-state-metrics.yaml.
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "~4.56.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  values:
    prometheus:
      monitor:
        enabled: false

    # hostNetwork, hostPID and the /proc + /sys hostPath mounts are what this
    # exporter is for, and stay. Capabilities are not: it reads those paths as
    # an unprivileged user (the chart already runs it as 65534) and needs none
    # of them. seccomp is missing from the chart's pod context entirely.
    securityContext:
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
