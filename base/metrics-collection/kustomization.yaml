---
# Site-agnostic collection: the site collector's forwarder and node log
# reader, and the exporters they scrape. Every site runs this; only
# METRICS_INGEST_URL, LOGS_INGEST_URL and SITE_NAME differ, from cluster-vars.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepositories.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - collector.yaml
  - node-log-reader.yaml

# Each release's river config, as a real file. disableNameSuffixHash is
# required: kustomize's nameReference transformer does not know about
# HelmRelease.spec.values.alloy.configMap.name, so a hashed name would leave
# the release pointing at a ConfigMap that does not exist. No reload is lost —
# the chart's configReloader sidecar watches the mounted file.
configMapGenerator:
  - name: collector-config
    namespace: monitoring
    options:
      disableNameSuffixHash: true
    files:
      - config.alloy=collector.alloy
  - name: node-log-reader-config
    namespace: monitoring
    options:
      disableNameSuffixHash: true
    files:
      - config.alloy=node-log-reader.alloy
