---
# Host metrics. Deployed standalone rather than as part of kube-prometheus-stack
# so that both sites run the identical exporter — Eastbank has no Prometheus
# operator, and Akron's stack no longer scrapes anything itself.
#
# serviceMonitor is off deliberately: Eastbank has no ServiceMonitor CRD, and on
# Akron the collector discovers this DaemonSet directly. See collector.alloy.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-node-exporter
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Report drift, never correct it — see the reasoning in
  # base/collector/kube-state-metrics.yaml.
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "~6.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  values:
    prometheus:
      monitor:
        enabled: false

    # hostNetwork, hostPID and the /proc + /sys hostPath mounts are what this
    # exporter is for, and stay. Capabilities are not: it reads those paths as
    # an unprivileged user (the chart already runs it as 65534) and needs none
    # of them. seccomp is missing from the chart's pod context entirely.
    securityContext:
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    # The textfile collector reads metrics that host-side jobs write:
    # host/disk-health/ is the first (#702). The directory is a hostPath of
    # its own, created by kubelet on every node, so a site with no such job
    # has an empty directory rather than a collector error. Read-only here;
    # only the host job writes. Helm replaces lists, so the chart's two
    # default filesystem excludes are repeated, unchanged.
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - --collector.textfile.directory=/host/textfile

    extraHostVolumeMounts:
      - name: textfile
        hostPath: /var/lib/node-exporter/textfile
        type: DirectoryOrCreate
        mountPath: /host/textfile
        readOnly: true

    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
