---
# Exposes PiHole on a MetalLB LoadBalancer with a stable IP: DNS on 53, and the
# web UI on 80. The fixed IP survives pod restarts/updates, so it can be set as
# the DNS server on your router and in /etc/resolv.conf on the node.
#
# Port 80 here is deliberately a second path to the UI, alongside Traefik's
# pihole.${HOSTNAME} route. It means the UI is reachable at the same address
# you already have to know (the DNS server's), it keeps working if Traefik is
# down or absent, and it is what `pi.hole` resolves to — see
# FTLCONF_dns_hosts in pihole-deployment.yaml.
#
# The Service is still named pihole-dns. Renaming it would delete and recreate
# the LoadBalancer, which is a DNS outage on every site, and the name is not
# worth that.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: dns
  annotations:
    metallb.universe.tf/loadBalancerIPs: "${METALLB_PIHOLE_IP}"
spec:
  selector:
    app: pihole
  type: LoadBalancer
  # Preserve real client IPs in PiHole query logs (single-node: no routing penalty)
  externalTrafficPolicy: Local
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
