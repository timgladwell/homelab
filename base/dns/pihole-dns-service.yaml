---
# Exposes PiHole's DNS on a MetalLB LoadBalancer with a stable IP. The fixed IP
# survives pod restarts/updates, so it can be set as the DNS server on your
# router and in /etc/resolv.conf on the node.
#
# DNS only. Port 80 used to be here too, publishing the admin UI on the DNS
# server's own address as a path that survived Traefik being down. Removed in
# #303: it was a duplicate of a route that now has a certificate, and it could
# not be given one itself — no public CA will issue for an RFC1918 address.
# Plaintext for no remaining benefit.
#
# Whether PiHole could serve its own certificate here was researched properly
# and the answer is in #304, decision included. Read that before reopening it.
#
# Normal access is unaffected: clients use pihole.${SITE_DOMAIN} through
# Traefik. Break-glass is `kubectl port-forward` — see
# docs/runbooks/pihole-access.md, which works in one case a hostname pointing
# here never could, namely a broken dnsmasq config where no name resolves.
#
# The Service is still named pihole-dns. Renaming it would delete and recreate
# the LoadBalancer, which is a DNS outage on every site, and the name is not
# worth that.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: dns
  annotations:
    metallb.universe.tf/loadBalancerIPs: "${METALLB_PIHOLE_IP}"
spec:
  selector:
    app: pihole
  type: LoadBalancer
  # Preserve real client IPs in PiHole query logs (single-node: no routing penalty)
  externalTrafficPolicy: Local
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
