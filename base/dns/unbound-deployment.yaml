---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: dns
  annotations:
    # unbound writes runtime state to /var/run/unbound; readOnlyRootFilesystem
    # requires mapping those paths which is outside what the upstream image guarantees.
    # Both probes intentionally query dnssec.works to confirm DNSSEC is active.
    # This is a single node deployment; single replica is sufficient for now.
    # No NetworkPolicy, deliberately: #79 closed. One was tried in #73 and
    # reverted in #77 after it broke DNS at every site, and what it bought was
    # ingress rules on a single-node cluster whose threat model does not
    # include a hostile pod already inside it. Read #79 before reopening.
    kube-score/ignore: >-
      container-security-context-readonlyrootfilesystem,container-security-context-user-group-id,pod-probes-identical,deployment-replicas,container-image-pull-policy,pod-networkpolicy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      # See base/dns/priorityclass.yaml.
      priorityClassName: dns-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unbound-exporter
          image: cyb3rjak3/unbound-exporter:0.6.0
          imagePullPolicy: IfNotPresent
          args:
            - --unbound.host=tcp://127.0.0.1:8953
            - --unbound.ca=
            - --unbound.cert=
            - --unbound.key=
          ports:
            - name: metrics
              containerPort: 9167
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
        - name: unbound
          image: klutchell/unbound:v1.26.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5335
              protocol: UDP
            - containerPort: 5335
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/unbound/custom.conf.d/unbound.conf
              subPath: unbound.conf
          # A full core, against a 14m average draw, is not a typo. Unbound
          # runs num-threads: 1 (unbound-configmap.yaml), so a 1000m CFS quota
          # is one it physically cannot exceed and throttling goes to zero
          # rather than merely down. At the previous 200m limit it was being
          # throttled in ~50% of every CFS period, continuously, at both
          # sites — 20ms of CPU per 100ms period against recursions that want
          # to burst for longer than that. The cost of a limit here is paid on
          # every uncached lookup; the benefit is nil, because a single-threaded
          # resolver cannot run away with the node. Memory request equals the
          # limit for the eviction-ranking reason in pihole-deployment.yaml
          # (peak working set 48Mi). See #115.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: "1"
              memory: 128Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          # This probe recurses to the internet and validates DNSSEC, so it
          # fails on a WAN blip as readily as on a broken Unbound. At the 1s
          # default timeout and 3 failures, a 90-second upstream wobble killed
          # the pod and took site DNS with it. Matches base/dns/pihole-deployment.yaml.
          livenessProbe:
            exec:
              command: ["drill-hc", "-p", "5335", "@127.0.0.1", "dnssec.works"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["drill-hc", "-p", "5335", "@127.0.0.1", "dnssec.works"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: unbound-config
