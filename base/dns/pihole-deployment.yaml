---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: dns
  annotations:
    # pihole runs as root (required for DNS port binding) and needs a writable
    # filesystem for FTL runtime state; these checks cannot be satisfied.
    # Both probes intentionally verify DNS resolution via dig.
    # This is a single node deployment; single replica is sufficient for now.
    # NetworkPolicy is pending re-addition with podSelector (namespaceSelector
    # blocked pihole→unbound traffic under Flannel).
    kube-score/ignore: >-
      container-security-context-readonlyrootfilesystem,container-security-context-user-group-id,deployment-replicas,container-image-pull-policy,pod-probes-identical,pod-networkpolicy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pihole
    spec:
      # No hostNetwork: MetalLB provides a stable external IP via the pihole-dns
      # LoadBalancer service. RollingUpdate is now safe because the old pod stays
      # alive (serving DNS) until the new pod passes its readiness probe.
      dnsPolicy: ClusterFirst
      containers:
        - name: pihole
          image: pihole/pihole:2026.07.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "America/Toronto"
            - name: FTLCONF_DNS_DOMAINNEEDED
              value: "true"
            - name: FTLCONF_DNS_BOGUSPRIV
              value: "true"
            # Unbound is the sole upstream DNS resolver. Using the pinned
            # ClusterIP directly avoids a circular dependency at startup:
            # dnsmasq would fail to resolve the hostname before the pod network
            # is ready, causing CrashLoopBackOff. See unbound-service.yaml.
            - name: FTLCONF_dns_upstreams
              value: "10.43.0.53#5335"
            - name: FTLCONF_webserver_session_timeout
              value: "604800"  # 7 days
            - name: FTLCONF_webserver_session_restore
              value: "false"
            - name: FTLCONF_webserver_port
              value: "8080"
            # Resolve `pi.hole` to the LoadBalancer IP so the short name serves
            # the UI from anywhere on the LAN. PiHole answers `pi.hole` with the
            # address it believes it is listening on, which in a pod is the pod
            # IP — unroutable from the LAN — so it has to be stated explicitly.
            # Points at the LoadBalancer rather than Traefik so it does not
            # depend on an ingress controller being present.
            - name: FTLCONF_dns_hosts
              value: "${METALLB_PIHOLE_IP} pi.hole"
            # PiHole is not the DHCP server
            - name: FTLCONF_dhcp_active
              value: "false"
            # Listen on all interfaces (required in Kubernetes pod networking)
            - name: FTLCONF_dns_listeningMode
              value: "all"
            # Block DNS bypass mechanisms
            - name: FTLCONF_dns_specialDomains_mozillaCanary
              value: "true"
            - name: FTLCONF_dns_specialDomains_iCloudPrivateRelay
              value: "true"
            - name: FTLCONF_dns_specialDomains_designatedResolver
              value: "true"
              # The secret contains FTLCONF_misc_dnsmasq_lines with a wildcard
              # address=/${HOSTNAME}/... that routes all *.homelab.home.arpa subdomains
              # to Traefik automatically — new apps get DNS without a manual entry.
            # Explicitly blank, not just omitted: FTLCONF_ vars are the source
            # of truth only while set. Omitting this var leaves whatever
            # password hash is already persisted in pihole.toml on the PVC
            # in effect; an empty string is required to actively clear it.
            - name: FTLCONF_webserver_api_password
              value: ""
          envFrom:
            - secretRef:
                name: pihole-secret
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command:
                - dig
                - +norecurse
                - +time=3
                - "@127.0.0.1"
                - pi.hole
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - dig
                - +norecurse
                - +time=3
                - "@127.0.0.1"
                - pi.hole
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config
