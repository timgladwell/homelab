---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: dns
  annotations:
    # pihole runs as root (required for DNS port binding) and needs a writable
    # filesystem for FTL runtime state; these checks cannot be satisfied.
    # Both probes intentionally verify DNS resolution via dig.
    # This is a single node deployment; single replica is sufficient for now.
    # NetworkPolicy is pending re-addition with podSelector (namespaceSelector
    # blocked pihole→unbound traffic under Flannel).
    kube-score/ignore: >-
      container-security-context-readonlyrootfilesystem,container-security-context-user-group-id,deployment-replicas,container-image-pull-policy,pod-probes-identical,pod-networkpolicy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pihole
    spec:
      # No hostNetwork: MetalLB provides a stable external IP via the pihole-dns
      # LoadBalancer service. RollingUpdate is now safe because the old pod stays
      # alive (serving DNS) until the new pod passes its readiness probe.
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pihole
          image: pihole/pihole:2026.07.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "America/Toronto"
            - name: FTLCONF_DNS_DOMAINNEEDED
              value: "true"
            - name: FTLCONF_DNS_BOGUSPRIV
              value: "true"
            # The local domain used for reverse DNS lookups. This site's own
            # subtree, matching the UniFi per-network "Domain Name".
            - name: FTLCONF_dns_domain_name
              value: "${SITE_DOMAIN}"
            # Conditional forwarding: reverse lookups for this LAN go to the
            # gateway, so DHCP-assigned hostnames resolve.
            # Format: <enabled>,<cidr-range>,<gateway-ip>,<local-domain>
            - name: FTLCONF_dns_revServers
              value: "true,${LAN_CIDR},${LAN_GATEWAY},${SITE_DOMAIN}"
            # Read /etc/dnsmasq.d/. FTL ignores that directory unless this is
            # set, and the DNS records mounted there are the whole point.
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
            # Explicitly blank for the same reason as the API password below:
            # the records moved to /etc/dnsmasq.d/ (see the volume mount), and
            # merely omitting this var would leave the old copy persisted in
            # pihole.toml on the PVC still in effect, duplicating every record.
            - name: FTLCONF_misc_dnsmasq_lines
              value: ""
            # Unbound is the sole upstream DNS resolver. Using the pinned
            # ClusterIP directly avoids a circular dependency at startup:
            # dnsmasq would fail to resolve the hostname before the pod network
            # is ready, causing CrashLoopBackOff. See unbound-service.yaml.
            - name: FTLCONF_dns_upstreams
              value: "10.43.0.53#5335"
            - name: FTLCONF_webserver_session_timeout
              value: "604800"  # 7 days
            - name: FTLCONF_webserver_session_restore
              value: "false"
            - name: FTLCONF_webserver_port
              value: "8080"
            # Do NOT add FTLCONF_dns_hosts for pi.hole. FTL synthesizes an A
            # record for pi.hole pointing at the pod's own interface IP at
            # runtime, and that synthesis outranks dns_hosts, dnsmasq address=
            # entries, and the IngressRoute. PRs #39, #58, #61, #62, #81, #82
            # and #83 all tried; #84 removed the lot as no-ops. The pod IP is
            # not in pihole.toml, so no FTLCONF_* key reaches it.
            # Use pihole.${SITE_DOMAIN}, or port-forward — see
            # docs/runbooks/pihole-access.md. The LoadBalancer carries DNS
            # only since #303, so there is no IP path to the UI any more.
            # PiHole is not the DHCP server
            - name: FTLCONF_dhcp_active
              value: "false"
            # Listen on all interfaces (required in Kubernetes pod networking)
            - name: FTLCONF_dns_listeningMode
              value: "all"
            # Block DNS bypass mechanisms
            - name: FTLCONF_dns_specialDomains_mozillaCanary
              value: "true"
            - name: FTLCONF_dns_specialDomains_iCloudPrivateRelay
              value: "true"
            - name: FTLCONF_dns_specialDomains_designatedResolver
              value: "true"
            # No password, deliberately — this is a product decision, not a
            # gap to close. Blocking has to be temporarily disableable by
            # anyone in the household, and PiHole has no user role: the only
            # account it has is full admin. A password here would mean either
            # sharing the admin credential or having people ask an
            # administrator every time something breaks, and a blocker that
            # is annoying to switch off is a blocker that gets ripped out.
            #
            # The exposure is bounded by reachability, not by a login: the UI
            # is only on the LAN, only over HTTPS, and only via Traefik at
            # pihole.${SITE_DOMAIN}. #303 removed the plaintext path that
            # bypassed it. A future PR gives non-admin clients their own page
            # for the disable action, at which point this can be revisited —
            # until then, changing it breaks people rather than protecting
            # them.
            #
            # Explicitly blank, not just omitted: FTLCONF_ vars are the source
            # of truth only while set. Omitting this var leaves whatever
            # password hash is already persisted in pihole.toml on the PVC
            # in effect; an empty string is required to actively clear it.
            - name: FTLCONF_webserver_api_password
              value: ""
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
            # DNS records, from base/dns/dnsmasq-base.conf plus this site's
            # own site.conf. Read-only: FTL must never write here.
            - name: dnsmasq-d
              mountPath: /etc/dnsmasq.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command:
                - dig
                - +norecurse
                - +time=3
                - "@127.0.0.1"
                - pi.hole
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - dig
                - +norecurse
                - +time=3
                - "@127.0.0.1"
                - pi.hole
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config
        - name: dnsmasq-d
          configMap:
            name: pihole-dnsmasq
