# Global dnsmasq directives, applied at every site.
#
# Mounted read-only at /etc/dnsmasq.d/dnsmasq-base.conf. PiHole only reads that
# directory when misc.etc_dnsmasq_d is true — see FTLCONF_misc_etc_dnsmasq_d
# in pihole-deployment.yaml.
#
# Each site merges its own site.conf into the same generated ConfigMap; see
# sites/<site>/infrastructure/kustomization.yaml.

# Answer this site's own subtree authoritatively — never forward it upstream.
local=/${HOSTNAME}/

# Wildcard: every *.${HOSTNAME} name resolves to Traefik, so a new app gets
# DNS from its IngressRoute alone with no record to add here.
address=/${HOSTNAME}/${METALLB_TRAEFIK_IP}
