# Global dnsmasq directives, applied at every site.
#
# Mounted read-only at /etc/dnsmasq.d/dnsmasq-base.conf. PiHole only reads that
# directory when misc.etc_dnsmasq_d is true — see FTLCONF_misc_etc_dnsmasq_d
# in pihole-deployment.yaml.
#
# Each site merges its own site.conf into the same generated ConfigMap; see
# sites/<site>/infrastructure/kustomization.yaml. More specific wins in
# dnsmasq, so a site.conf record always beats anything below.

# Answer this site's own subtree authoritatively — never forward it upstream.
local=/${SITE_DOMAIN}/

# Wildcard: every *.${SITE_DOMAIN} name resolves to Traefik, so a new app gets
# DNS from its IngressRoute alone with no record to add here.
address=/${SITE_DOMAIN}/${METALLB_TRAEFIK_IP}

# The whole internal tree, one label up. This is what makes site-local names
# work: pihole.${BASE_DOMAIN} resolves to *this* site's Traefik, because every
# client uses the PiHole in the building it is standing in. Same name, local
# answer, no anycast and no BGP.
#
# dnsmasq takes the most specific matching domain, so this and the ${SITE_DOMAIN}
# pair above coexist rather than competing — `local=` is documented as exactly
# `server=/domain/` with no address, and repeating either for different domains
# is ordinary usage.
#
# DNS is only the first third. The name must also be on the certificate
# (base/cert-manager-config/certificate.yaml) and matched by a router
# (base/traefik-routes/), or it resolves and then fails in a way that looks
# like a TLS or ingress bug.
#
# It also makes this PiHole authoritative for a zone that really exists in
# Cloudflare, so _acme-challenge lookups through here return NODATA rather
# than being forwarded. cert-manager sidesteps that with
# --dns01-recursive-nameservers-only (base/cert-manager/helmrelease.yaml);
# nothing else asks.
#
# Names under this tree that are NOT behind Traefik need an explicit override,
# or they land here instead. The two every site has are below; anything else
# (a Service with its own MetalLB IP) goes in that site's site.conf.
local=/${BASE_DOMAIN}/
address=/${BASE_DOMAIN}/${METALLB_TRAEFIK_IP}

# The node and the gateway are real hosts, not ingress routes. Both records are
# entirely variables, so they belong here rather than being copied into every
# site.conf — a new site gets both names by defining NODE_IP and LAN_GATEWAY.
# Without them the catch-all above sends both to Traefik, which answers for
# neither, and SSH to the node lands on the ingress controller.
address=/k3s01.${SITE_DOMAIN}/${NODE_IP}

# `host-record=` because the UDR needs its PTR answered here too — the gateway
# answers its own reverse lookup with UniFi OS's built-in `unifi`, and no
# setting on the device changes that. See docs/naming-convention.md.
host-record=udr.${SITE_DOMAIN},${LAN_GATEWAY}
