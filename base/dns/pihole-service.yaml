# Web UI service, routed via Traefik at pihole.${SITE_DOMAIN}, and the target of
# the `kubectl port-forward` break-glass path when Traefik is not routing — see
# docs/runbooks/pihole-access.md. Deliberately ClusterIP: the LoadBalancer beside
# it (pihole-dns-service.yaml) carries DNS only.
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: dns
spec:
  selector:
    app: pihole
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
