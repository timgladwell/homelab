# Web UI service, routed via Traefik at pihole.${HOSTNAME}.
# The UI is also reachable directly on the LoadBalancer IP — see
# pihole-dns-service.yaml.
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: dns
spec:
  selector:
    app: pihole
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
