---
# Requested but not yet consumed by anything — no IngressRoute or TLSStore
# references this Secret. Deliberate for this iteration (#231): a failure
# here is invisible to users and can be debugged without an outage. Wiring
# this into Traefik is iteration 4 of #228, alongside the staging ->
# production issuer flip.
#
# Lives in the traefik namespace (not cert-manager) because that's where
# it will actually be consumed once wired up, avoiding a cross-namespace
# secret move later.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard
  namespace: traefik
spec:
  secretName: internal-wildcard-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - ${SITE_NAME}.internal.zerpzorp.com
    - "*.${SITE_NAME}.internal.zerpzorp.com"
    # The apex pair below is deliberately identical at every site — it is
    # not a missing ${SITE_NAME}. Each site's PiHole answers
    # *.internal.zerpzorp.com with its own local addresses, so
    # pihole.internal.zerpzorp.com resolves to whichever site you are
    # standing in (site-local resolution standing in for anycast), and each
    # site serves a quick-links landing page at the bare apex. Both mean
    # every site's Traefik has to present a cert for these two names, so
    # every site issues its own.
    #
    # That makes _acme-challenge.internal.zerpzorp.com a record every site
    # writes to. Accepted, not overlooked: multiple TXT records at one
    # challenge name is ordinary DNS-01 (the bare name and the wildcard
    # already need two), cert-manager's Cloudflare solver only removes the
    # value it added, and renewals are ~60 days apart per site against a
    # challenge window of minutes. Issuing once and syncing the Secret
    # between sites is the only way to avoid it, and it costs cross-site
    # secret distribution — a worse trade.
    - internal.zerpzorp.com
    - "*.internal.zerpzorp.com"
