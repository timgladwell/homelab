---
# Eastbank collects and ships; it stores nothing. Prometheus, Grafana, Loki and
# Alertmanager all live at Akron, which is the only site with storage that
# tolerates them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/metrics-collection
  - resourcequota.yaml
  - ./unpoller
  # Temporary; see docs/runbooks/trivy-operator-audit.md. Unpoller is the one
  # workload in this repo that nothing has ever scanned — it runs only here,
  # and its rendered Deployment is invisible to validation step 6.
  - ../../../base/trivy-operator
