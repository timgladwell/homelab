---
# Eastbank stores nothing — base/metrics-collection/ plus Unpoller, which
# polls every UniFi controller and ships the result to Akron. Far smaller than
# Akron's; see sites/akron/monitoring/resourcequota.yaml.
#
# Headroom above the sum of requests is deliberate: a Deployment's rolling
# update briefly runs old and new pods together, and a quota sized to exactly
# fit steady state fails that rollout. Akron learned this the hard way.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring
  namespace: monitoring
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 768Mi
    limits.cpu: "2"
    limits.memory: 2Gi
