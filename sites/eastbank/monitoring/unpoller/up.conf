# Unpoller's own configuration, mounted at /etc/unpoller/up.conf.
#
# Generated into the unpoller-config Secret by kustomization.yaml, with the
# hash suffix on: an edit renames the Secret, which changes the pod's volume
# and restarts it. The chart mounts its config by subPath, which Kubernetes
# never refreshes in place, so before this file existed (as the chart's
# upConfig value, rendered into a Secret with no checksum) an edit reached the
# cluster and was not read until something unrelated restarted the pod (#388).
#
# It is a Secret only because the chart's upConfigExistingSecret accepts
# nothing else. Nothing in it is secret.
#
# What Unpoller does, in the clear. What it connects to lives entirely in
# secret.sops.yaml — URL, username and password together, because a username
# without its password is still half a credential and an address without
# either still says where to point one. The split is by *kind*, not by
# field: nothing here identifies or reaches a controller.
#
# Note there are no [[unifi.controller]] stanzas. They come from
# UP_UNIFI_CONTROLLER_<n>_* environment variables instead, so there is one
# source for a controller rather than two halves to keep in step. Every
# setting below still reaches them: setControllerDefaults() copies each
# unset field from [unifi.defaults] onto every controller, however it was
# defined (verified in v3.4.1, pkg/inputunifi/interface.go).
#
# Flux's postBuild substitution does not reach into a generated Secret's
# data, so ${VAR} placeholders would stay literal here. None are used.

[poller]
  debug = false
  quiet = false
  plugins = []

# Not a client — this is the /metrics listener the local Alloy scrapes.
# 0.0.0.0 because Alloy is a different pod. Akron's Prometheus never
# reaches out here; it only receives what Alloy remote-writes.
[prometheus]
  disable = false
  http_listen = "0.0.0.0:9130"
  report_errors = false
  # v3.2.0 serves scrapes from a background poll instead of hitting the
  # UniFi API per scrape. Kept: three controllers over a VPN is the case
  # it was added for. `interval = 0` restores the old per-scrape one.
  #
  # 5m, not 60s: each poll cycle leaks ~21 KB in the UDR's unifi-core,
  # so polling sets the leak rate (#388, from clincha-org/clincha#480's
  # A/B). The [loki] interval below is a separate poll cycle and is
  # set to match. Shorten either only once #388 says the leak is fixed.
  interval = "5m"

[influxdb]
  disable = true

# The Alloy beside this pod, not Akron directly — it serves Loki's push
# API and forwards with a disk buffer in front of it. See
# base/metrics-collection/alloy-metrics.yaml.
[loki]
  disable = false
  url = "http://alloy-metrics.monitoring.svc.cluster.local:3100"
  # Polls events, system log and Protect logs on its own ticker
  # (default 2m), independent of [prometheus]. See the comment there.
  interval = "5m"

[unifi]
  dynamic = false

# Applied to every controller defined in the environment. save_syslog is
# v3-only and reads the controller's system-log API — that is not the
# same thing as the UDM's own device syslog, which is #246.
#
# save_ids is off: confirmed live against Network 10.5.67 that the
# endpoint is gone outright ("IDS/IPS endpoint removed (Network 10.x+):
# no replacement available"), not the 404 v3.4.1 fixed for #122 — dead
# config on this version, not a regression.
#
# save_alarms is off: GetAlarms 400s against Network 10.5.67 on every
# cycle, same shape of library/firmware mismatch as #122 but with no
# fix released yet. See #257.
#
# save_traffic is off: per-flow DPI logging, meaningfully higher
# cardinality and write volume than anything else here, no security-log
# use case pulls its weight.
[unifi.defaults]
  sites = ["all"]
  save_sites = true
  save_dpi = true
  save_syslog = true
  save_ids = false
  save_events = true
  save_alarms = false
  save_anomalies = true
  save_rogue = true
  save_protect_logs = true
  verify_ssl = false
