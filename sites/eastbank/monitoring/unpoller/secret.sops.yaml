# Each controller's identity, whole. Keys are literally the environment
# variable names Unpoller reads (prefix UP, then the struct's xml tags —
# pkg/inputunifi/input.go), so the HelmRelease needs one envFrom rather than an
# entry per field, and adding a fourth controller is three more keys here and
# nothing anywhere else.
#
# URL, user and pass stay together deliberately: a username without its
# password is still half a credential, and an address without either still says
# where to point one. What Unpoller *collects* is not secret and lives in
# helmrelease.yaml in the clear.
#
# Index order is arbitrary and has no relationship to site precedence; the
# names in Grafana come from DEFAULT_SITE_NAME_OVERRIDE.
