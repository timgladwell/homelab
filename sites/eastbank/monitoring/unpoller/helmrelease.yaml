---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Report drift, never correct it — see the reasoning in
  # base/collector/kube-state-metrics.yaml.
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: unpoller
      # A patch range like every other chart, so a new minor arrives as a
      # Renovate PR rather than deploying unreviewed.
      version: "~2.9.0"
      sourceRef:
        kind: HelmRepository
        name: unpoller
        namespace: monitoring
      interval: 12h
  postRenderers:
    - kustomize:
        patches:
          # The chart's PodMonitor is unconditional — there is no value that
          # turns it off, and it is named `unifi-poller` regardless of release
          # name, which is the "single instance assumed" behaviour behind #120.
          # Eastbank has no Prometheus operator, so leaving it in would fail the
          # install with `no matches for kind "PodMonitor"`. Alloy scrapes this
          # pod instead; see base/collector/collector.alloy.
          - target:
              kind: PodMonitor
              name: unifi-poller
            patch: |
              $patch: delete
              apiVersion: monitoring.coreos.com/v1
              kind: PodMonitor
              metadata:
                name: unifi-poller

          # The controllers themselves — see the secret. The chart exposes no
          # env or envFrom, so a patch is the only way in. The secret's keys
          # *are* the env var names, which keeps this to one reference rather
          # than one entry per field.
          #
          # The chart's liveness probe also runs from second zero with no
          # startup grace, and on Eastbank's SD card Unpoller can take longer
          # than its ~30s to open the port, so it was killed on cold starts
          # (#488). The startupProbe holds liveness off for up to 5 minutes;
          # readiness is left as the chart sets it.
          - target:
              kind: Deployment
              name: unpoller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: unpoller
              spec:
                template:
                  spec:
                    containers:
                      - name: unpoller
                        envFrom:
                          - secretRef:
                              name: unpoller-controllers
                        startupProbe:
                          httpGet:
                            path: /
                            port: tcp
                          periodSeconds: 10
                          failureThreshold: 30
  values:
    image:
      # The chart's appVersion trails Unpoller's releases: its release workflow
      # bumps it on some app releases, not all (chart 2.9.0 carries v5.5.0).
      # Without this pin a chart bump could move the app backwards, so the
      # tag is pinned and Renovate tracks the app itself (#122, #534). This
      # is safe because the chart is a thin wrapper: it mounts up.conf at
      # /etc/unpoller/up.conf and sets no flags. On a major bump, check that
      # path and up.conf's keys against the release.
      #
      # renovate: datasource=docker depName=ghcr.io/unpoller/unpoller
      tag: v5.8.1

    # Dashboards are provisioned from ConfigMaps in sites/akron/monitoring/
    # dashboards/. The chart's own provisioning needs the Grafana operator.
    dashboards:
      create: false
      grafana:
        create: false

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # The chart ships no security context at all, so this ran as root with a
    # writable root filesystem and every capability — 13 findings, and the only
    # workload in this repo nothing had ever scanned. It is chart-rendered, so
    # validation step 6 sees a HelmRelease and stops; and it runs only at
    # Eastbank, so the Akron audit never saw it either (#263).
    #
    # It needs none of it: a Go binary that polls UniFi controllers over HTTP,
    # takes its configuration from envFrom above and a read-only Secret at
    # /etc/unpoller/up.conf, and writes nothing to disk. 65534 rather than the
    # chart's suggested 1000 so it clears KSV-0020/0021 as well, matching
    # node-exporter.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    # up.conf beside this file, generated into a hash-suffixed Secret by
    # kustomization.yaml. kustomizeconfig.yaml teaches kustomize's
    # nameReference this field, so it carries the hashed name and a config
    # edit restarts the pod. See the top of up.conf.
    upConfigExistingSecret:
      name: unpoller-config
      key: up.conf
