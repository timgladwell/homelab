---
# Eastbank's infrastructure layer. Identical component set to Akron's — the
# only differences are this site's Cloudflare API token and its own dnsmasq
# records (site.conf).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/metallb
  - ../../../base/traefik
  - ../../../base/dns
  - ../../../base/system-upgrade-controller
  - ../../../base/cert-manager
  - cloudflare-secret.sops.yaml
configMapGenerator:
  # This site's dnsmasq records, merged into the ConfigMap generated by
  # base/dns/. dnsmasq-base.conf holds the global directives; this holds ours.
  # namespace must match base/dns/'s generator entry or the merge silently
  # generates a second ConfigMap instead of merging into it.
  - name: pihole-dnsmasq
    namespace: dns
    behavior: merge
    files:
      - site.conf
