# Eastbank's dnsmasq directives, merged into the pihole-dnsmasq ConfigMap
# alongside base/dns/dnsmasq-base.conf and mounted at /etc/dnsmasq.d/site.conf.
#
# This is Eastbank's override of the shared base template, so it names other
# sites, not Eastbank. Eastbank's own names (its subtree, node, gateway and
# syslog address) come from dnsmasq-base.conf, filled in with Eastbank's
# variables. What's left for this file is where the base template sends
# another site's names to the wrong place: Eastbank's own Traefik.
#
# Everything here is an override of a wildcard in dnsmasq-base.conf. More
# specific wins in dnsmasq, so these beat both the ${SITE_DOMAIN} and the
# ${BASE_DOMAIN} catch-alls.

# Akron's subtree, resolved across the Site Magic VPN to its Traefik. The
# mirror of the eastbank line in Akron's site.conf; without it, a browser here
# reaches Akron's names on *this* site's Traefik and gets a certificate error,
# because a wildcard matches one label and grafana.akron.internal… is two down.
#
# This does not put the resolver back into the telemetry path. The collector
# pins Akron's two telemetry names in its own /etc/hosts
# (sites/eastbank/monitoring/collector-hostaliases.yaml), and /etc/hosts
# is consulted before DNS — so this record serves people, not pipelines.
address=/${AKRON_SITE_DOMAIN}/${AKRON_TRAEFIK_IP}

# Akron's syslog address, which isn't behind its Traefik. More specific than
# the line above, so it wins. The mirror is in Akron's site.conf.
address=/syslog.${AKRON_SITE_DOMAIN}/${AKRON_SYSLOG_IP}
