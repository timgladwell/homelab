# Eastbank's dnsmasq directives, merged into the pihole-dnsmasq ConfigMap
# alongside base/dns/dnsmasq-base.conf and mounted at /etc/dnsmasq.d/site.conf.
#
# Deliberately empty of records: everything Eastbank resolves today is covered
# by the wildcard in dnsmasq-base.conf. The file still has to exist — policy/
# pihole_dnsmasq_site.rego fails the build without it, because a missing site
# file is indistinguishable from "this site wants no records".
