---
# One pod's worth plus margin, which is the right sizing *because* the Deployment
# uses Recreate: the old pod is gone before the new one starts, so old and new
# never coexist and the overlap headroom a RollingUpdate needs does not apply.
# If that strategy ever changes back, this has to double — a quota that fits only
# one pod rejects the incoming pod outright rather than delaying it, which is how
# the monitoring quota broke Grafana's rollout (sites/akron/monitoring/).
#
# The margin above one pod is deliberate: the workload's own limits were raised
# once already after a GeoLite2 download OOMKilled it, and a quota pinned exactly
# to the pod turns the next such adjustment into two changes instead of one.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apps
  namespace: apps
spec:
  hard:
    requests.cpu: 300m
    requests.memory: 768Mi
    limits.cpu: "2"
    limits.memory: 1536Mi
