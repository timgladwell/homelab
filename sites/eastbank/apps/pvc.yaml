---
# SQLite, and nothing else in practice. The app's own monitoring half — the
# InfluxDB buckets fed by SNMP polling — is turned off in Settings, because a
# continuous time-series write stream onto this node's SD card is the wear
# pattern that keeps Prometheus at Akron and nowhere else. See the reasoning in
# deployment.yaml.
#
# 10Gi therefore has plenty of headroom, and is deliberately not trimmed: it
# matches what this ran with before, and local-path allocates on use rather
# than up front, so a large claim costs nothing until something fills it.
#
# ASSUMES(single-node): local-path keeps this volume on one node and pins
# network-optimizer there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: network-optimizer
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
