---
# Post-infrastructure config — needs CRDs installed by the infrastructure
# layer (MetalLB IPAddressPool, Traefik IngressRoute), hence a separate Flux
# Kustomization with dependsOn: infrastructure.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/coredns-config
  - ../../../base/metallb-config
  - ../../../base/traefik-routes
  - ../../../base/cert-manager-config
