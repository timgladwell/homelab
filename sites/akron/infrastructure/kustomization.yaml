---
# Akron's infrastructure layer: shared components from base/ plus Akron's own
# Cloudflare API token and dnsmasq records. Every site composes this layer the
# same way — base/ holds no site values and no secrets, so there is nothing to
# delete or patch away here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/metallb
  - ../../../base/traefik
  - ../../../base/dns
  - ../../../base/system-upgrade-controller
  - ../../../base/cert-manager
  - cloudflare-secret.sops.yaml
configMapGenerator:
  # This site's dnsmasq records, merged into the ConfigMap generated by
  # base/dns/. dnsmasq-base.conf holds the global directives; this holds ours.
  # namespace must match base/dns/'s generator entry or the merge silently
  # generates a second ConfigMap instead of merging into it.
  - name: pihole-dnsmasq
    namespace: dns
    behavior: merge
    files:
      - site.conf
