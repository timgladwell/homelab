# Akron's dnsmasq directives, merged into the pihole-dnsmasq ConfigMap
# alongside base/dns/dnsmasq-base.conf and mounted at /etc/dnsmasq.d/site.conf.
#
# Everything here is an override of a wildcard in dnsmasq-base.conf. More
# specific wins in dnsmasq, so these beat both the ${SITE_DOMAIN} and the
# ${BASE_DOMAIN} catch-alls.

# Eastbank's subtree, resolved across the Site Magic VPN to its Traefik.
# More specific than ${BASE_DOMAIN}, so it wins over the local catch-all.
address=/eastbank.${BASE_DOMAIN}/${EASTBANK_TRAEFIK_IP}

# Eastbank's syslog address, which isn't behind its Traefik. More specific
# than the line above, so it wins. The mirror is in Eastbank's site.conf.
address=/syslog.eastbank.${BASE_DOMAIN}/${EASTBANK_SYSLOG_IP}
