# Akron's dnsmasq directives, merged into the pihole-dnsmasq ConfigMap
# alongside base/dns/dnsmasq-base.conf and mounted at /etc/dnsmasq.d/site.conf.

# Syslog is a MetalLB Service of its own, not behind Traefik, so the wildcard
# in dnsmasq-base.conf would send it to the wrong IP. More specific wins in dnsmasq.
address=/syslog.${HOSTNAME}/${METALLB_SYSLOG_IP}

# Eastbank's subtree, resolved across the Site Magic VPN to its Traefik.
address=/eastbank.home.arpa/10.4.1.80
