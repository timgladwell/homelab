---
# The entry point for remote sites' metrics. Deliberately path-scoped rather
# than exposing Prometheus on its own LoadBalancer: this publishes only the
# remote-write endpoint, keeping the query UI and admin API off the LAN.
#
# Matched on a hostname rather than on this Traefik's LoadBalancer IP, which is
# what it used to be. TLS is why: Traefik picks the certificate from SNI, and a
# client connecting to an IP sends no SNI at all.
#
# Nothing in the metrics path depends on cross-site DNS all the same. The
# remote collector pins this name into its own /etc/hosts — see
# sites/eastbank/monitoring/alloy-metrics-hostaliases.yaml — so PiHole, which
# is both the resolver and one of the things being monitored, is never in the
# path of the telemetry that would show it failing.
#
# A bare PathPrefix rule with no Host would work too, but it matches every
# hostname reaching this Traefik, so pihole.${SITE_DOMAIN}/api/v1/write would
# also land on Prometheus. Not an exposure difference — a client can set any
# Host header it likes — but it shadows routes it has no business shadowing.
#
# Lives here rather than in base/traefik-routes/ for the same reason
# grafana-ingressroute.yaml does: it targets a Service that exists only at
# Akron. The monitoring Kustomization dependsOn infrastructure, so the
# IngressRoute CRD is installed by the time this applies.
#
# HTTPS but still unauthenticated: TLS proves the collector is talking to the
# right Prometheus and keeps the samples off the wire in clear, and it is
# reachable only from the LAN and the Site Magic VPN. Authenticating the client
# is mTLS, deferred in #228 — the naming here is already shaped for it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-remote-write
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prometheus.${SITE_DOMAIN}`) && PathPrefix(`/api/v1/write`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
  tls: {}
