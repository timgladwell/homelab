---
# The entry point for remote sites' metrics. Deliberately path-scoped rather
# than exposing Prometheus on its own LoadBalancer: this publishes only the
# remote-write endpoint, keeping the query UI and admin API off the LAN.
#
# Matched on the LoadBalancer IP as the Host, because that is literally what a
# client sends when it posts to http://10.6.1.80/api/v1/write. Remote sites can
# therefore target the IP directly and nothing in the metrics path depends on
# cross-site DNS — which matters because PiHole is both the resolver and one of
# the things being monitored, so a DNS outage would otherwise blind us exactly
# when we need to see.
#
# A bare PathPrefix rule with no Host would work too, but it matches every
# hostname reaching this Traefik, so pihole.${HOSTNAME}/api/v1/write would also
# land on Prometheus. Not an exposure difference — a client can set any Host
# header it likes — but it shadows routes it has no business shadowing.
#
# When hostnames move off home.arpa to a domain that can hold a real
# certificate, this becomes a normal Host(`prometheus.${HOSTNAME}`) rule and the
# remote collectors get a hostAlias pinning that name to this IP, keeping the
# no-resolver property.
#
# Lives here rather than in base/traefik-routes/ for the same reason
# grafana-ingressroute.yaml does: it targets a Service that exists only at
# Akron. The monitoring Kustomization dependsOn infrastructure, so the
# IngressRoute CRD is installed by the time this applies.
#
# Plain HTTP, unauthenticated, matching every other ingress in this repo. It is
# reachable only from the LAN and the Site Magic VPN. Fixing that properly means
# a repo-wide TLS pass, not a special case here.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-remote-write
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${METALLB_TRAEFIK_IP}`) && PathPrefix(`/api/v1/write`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
