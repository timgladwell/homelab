# Two hosts, one router. The site-qualified name always works from anywhere;
# the bare one is the site-local name — it resolves to whichever site the client
# is standing in (base/dns/dnsmasq-base.conf) and has to be matched here, or it
# resolves perfectly, presents a valid certificate, and 404s.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.${SITE_DOMAIN}`, `grafana.${BASE_DOMAIN}`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls: {}
