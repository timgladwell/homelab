---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: loki
      version: "~7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  values:
    loki:
      auth_enabled: false
      # The chart already runs Loki as 10001 with a read-only root and no
      # capabilities; seccomp is the only thing it leaves unset.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      analytics:
        reporting_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      compactor:
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem
      # snake_case, and it matters. `{{- with .Values.loki.limits_config }}`
      # is the only thing that renders this block, so a `limitsConfig:` key is
      # not rejected — it is silently dropped, and the whole section falls back
      # to chart defaults. It was spelled that way here from the v6 upgrade
      # until #287, so every limit here — `retention_period` included — was a
      # value nothing read. Loki came up healthy throughout; the failure mode
      # is silence, not a CrashLoop. Verify any change to this block by
      # grepping the rendered ConfigMap, not by reading the values:
      #   flate build hr -p clusters/akron
      limits_config:
        retention_period: 168h
        # Query cost is bounded separately, and deliberately so — the point is
        # to keep 90d of logs *and* never let a single query hurt a 4-core Pi.
        #
        # max_query_length hard-fails a range longer than a week. Reaching
        # further back is still fine: pick a narrow window 60 days ago and it
        # costs what a narrow window always costs.
        #
        # max_querier_bytes_read is the real guard, and the analogue of
        # Prometheus's maxSamples — it bounds a query by how much data it would
        # actually pull rather than by how much wall-clock it spans, so a 7d
        # query over a quiet stream stays cheap while an hour over everything
        # fails. The default is 150GB, which on this node is no limit at all.
        # It is not enforced on log queries with no filter expression; those
        # are capped by max_entries_limit_per_query (5000) instead.
        #
        # Deliberately NOT setting max_query_lookback. It clamps the requested
        # range instead of rejecting it, and it applies to metadata as well as
        # data — so bounding it below retention_period would silently truncate
        # results and leave 90d of logs on disk that nothing can reach.
        query_timeout: 60s
        max_query_length: 168h
        max_querier_bytes_read: 2GB
        max_query_parallelism: 4
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

    deploymentMode: SingleBinary

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 8Gi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 512Mi

    # The rules sidecar watches for ConfigMaps/Secrets labeled loki_rule to load
    # alerting/recording rules. Nothing in this repo creates one — no alerting
    # exists yet (#214) — so it's an idle container with no resources by chart
    # default, which the ResourceQuota on this namespace would otherwise reject.
    sidecar:
      rules:
        enabled: false

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    # The gateway is an nginx reverse proxy whose job is routing Loki API paths
    # across separate components — distributor for writes, query-frontend for
    # reads. In SingleBinary mode there is one component, so every one of its
    # ~20 proxy_pass directives targets the same backend this chart already
    # exposes as `loki:3100`. Nothing in the repo addresses it: Alloy, Grafana's
    # datasource and the loki-push IngressRoute all go direct. It is an nginx
    # process serving zero requests.
    #
    # Worth re-enabling if Loki ever moves to SimpleScalable, where it becomes
    # the correct single entry point. Until then it is a hop to nowhere.
    gateway:
      enabled: false

    # The canary continuously writes synthetic log lines and reads them back to
    # verify the write/read path. Sound practice for a production cluster with
    # someone on call; here it spends ingest, CPU and space in an 8Gi PVC on a
    # signal nothing consumes — no alerting exists (#214) and no dashboard shows
    # it, so the result is computed and discarded.
    lokiCanary:
      enabled: false

    # The chart's helm-test pod queries the canary, so it cannot outlive it.
    test:
      enabled: false
