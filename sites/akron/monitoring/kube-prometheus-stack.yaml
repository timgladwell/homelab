---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "~88.4.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  values:
    grafana:
      enabled: true
      adminPassword: ""
      admin:
        existingSecret: grafana-secret
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 2Gi
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: false
      grafana.ini:
        analytics:
          reporting_enabled: false
          check_for_updates: false
        security:
          disable_gravatar: true
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        dashboards:
          enabled: true
          searchNamespace: ALL
        datasources:
          enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 768Mi
      # initChownData has no resources by chart default; the ResourceQuota on
      # this namespace requires every pod to declare them.
      initChownData:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi

    prometheus:
      prometheusSpec:
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 7d
        retentionSize: 6GB
        # Every site — including this one — pushes through remote write rather
        # than being scraped. See base/metrics-collection/.
        enableRemoteWriteReceiver: true
        tsdb:
          # Required, not optional. A remote site that has been offline replays
          # its buffered WAL on reconnect, and Prometheus rejects samples older
          # than its head block's min-valid-time (~2h) as "out of bounds" —
          # without this window the buffer is decorative. Kept equal to the
          # collector's wal.max_keepalive_time in
          # base/metrics-collection/alloy-metrics.yaml.
          outOfOrderTimeWindow: 24h
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 14Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 2Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

    # Scraping moved out of this chart entirely. Akron and every remote site now
    # run the same collector (base/metrics-collection/), which discovers these
    # targets itself and pushes over remote write. Keeping both would
    # double-collect on Akron, and the cardinality-trimming rules that used to
    # live here would have needed a second copy in the collector's config —
    # which is exactly the drift the shared component exists to prevent. The
    # rules moved verbatim; they are now in alloy-metrics.yaml only.
    #
    # node-exporter and kube-state-metrics are still deployed, just from
    # base/metrics-collection/ so that both sites get the identical version.
    kubelet:
      enabled: false

    kubeApiServer:
      enabled: false

    nodeExporter:
      enabled: false

    kubeStateMetrics:
      enabled: false

    prometheusOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # The webhook cert patch Job (a Helm hook) has no resources by chart
      # default; the ResourceQuota on this namespace requires every pod to
      # declare them.
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

    kubeControllerManager:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeEtcd:
      enabled: false

    kubeProxy:
      enabled: false
