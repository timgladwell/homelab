---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Report drift, never correct it — see the reasoning in
  # base/collector/kube-state-metrics.yaml.
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "~92.21.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  values:
    # Prometheus stores every site, so a default rule aggregating without
    # `site` merges them: cluster:node_cpu:ratio_rate5m was one number for
    # Akron and Eastbank together.
    defaultRules:
      additionalAggregationLabels: [site]
      rules:
        # additionalAggregationLabels only extends an existing `by (…)`, and
        # two rules in this group aggregate with a bare sum(), so they still
        # merge the sites. The chart can't disable a recording rule alone,
        # and nothing reads any of the six (#511). They're saved queries over
        # node_cpu_seconds_total and node_network_*_bytes_total, so run them
        # ad hoc when needed, e.g. busy cores per site:
        #   sum by (site) (rate(node_cpu_seconds_total{mode!="idle",mode!="iowait",mode!="steal"}[5m]))
        kubePrometheusNodeRecording: false

    # Rules defined here, rendered by the chart as PrometheusRules, so Helm
    # installs them after the CRDs (a PrometheusRule in a layer beside this
    # HelmRelease would fail on a fresh cluster).
    additionalPrometheusRulesMap:
      # Flux deployment events (#648), site level. They read the
      # per-Kustomization series that Loki's ruler writes
      # (loki-rules/deployment.yaml, which explains the shape and keys), and
      # add gotk_resource_info, which Loki can't see. Rules in a group run in
      # order at one timestamp, so later rules read earlier ones' results.
      deployment:
        groups:
          - name: deployment
            # Matches the scrape interval and the Loki rules (#648); the global
            # evaluationInterval below is 60s.
            interval: 30s
            rules:
              # How many Kustomizations the site has, for every commit it
              # started. The count is today's, so a commit that added or
              # removed a Kustomization is measured against the new count.
              - record: zerpzorp_deployment_kustomizations
                labels:
                  state: expected
                expr: |
                  count by (site, revision, sha) (zerpzorp_deployment_timestamp_seconds{event="started"}) * 0
                  + on (site) group_left ()
                  count by (site) (count by (site, name) (gotk_resource_info{customresource_kind="Kustomization"}))
              - record: zerpzorp_deployment_kustomizations
                labels:
                  state: applied
                expr: |
                  count by (site, revision, sha) (zerpzorp_deployment_kustomization_timestamp_seconds{event="applied"})
              - record: zerpzorp_deployment_kustomizations
                labels:
                  state: failed
                expr: |
                  count by (site, revision, sha) (zerpzorp_deployment_kustomization_timestamp_seconds{event="failed"})
              # Finished: the last Kustomization applied the commit, once every
              # Kustomization has. A failure first then a success on retry
              # gives both `failed` and `finished` for one commit, as a health
              # check timing out mid chart upgrade does (#648, 2026-11-08). A
              # commit superseded before every Kustomization applies it never
              # finishes.
              - record: zerpzorp_deployment_timestamp_seconds
                labels:
                  event: finished
                expr: |
                  max by (site, revision, sha) (zerpzorp_deployment_kustomization_timestamp_seconds{event="applied"})
                  and on (site, revision, sha)
                  (zerpzorp_deployment_kustomizations{state="applied"}
                    >= ignoring (state) zerpzorp_deployment_kustomizations{state="expected"})
              - record: zerpzorp_deployment_timestamp_seconds
                labels:
                  event: failed
                expr: |
                  min by (site, revision, sha) (zerpzorp_deployment_kustomization_timestamp_seconds{event="failed"})
              - record: zerpzorp_deployment_duration_seconds
                expr: |
                  max without (event) (zerpzorp_deployment_timestamp_seconds{event="finished"})
                  - max without (event) (zerpzorp_deployment_timestamp_seconds{event="started"})

    grafana:
      enabled: true
      adminPassword: ""
      admin:
        existingSecret: grafana-secret
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 2Gi
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: false
      grafana.ini:
        analytics:
          reporting_enabled: false
          check_for_updates: false
        dataproxy:
          # Seconds, and must be >= the prometheusSpec.query.timeout set
          # further down this file, or Grafana reports a failure for a query
          # Prometheus is still legitimately running.
          timeout: 60
        dashboards:
          # A dashboard left open in a browser tab costs ~280Mi and ~24m CPU
          # here, because Grafana keeps re-running its panel queries on the
          # auto-refresh interval whether or not anyone is looking (#287).
          # That cost, not the 30s scrape interval, sets the floor: a refresh
          # every scrape would redraw one new sample for twice the CPU. This is
          # a floor no dashboard can go below, which is why it is set here
          # rather than per-dashboard.
          min_refresh_interval: 1m
        # Browsing has always worked and still would without these: Grafana
        # emits *relative* URLs for its own navigation, so it never needs to
        # know its external name to serve the UI. root_url only governs the
        # places it has to write an absolute URL with no request to derive it
        # from — alert notification links, share and snapshot URLs, and OAuth
        # redirect URIs. Those were the default localhost:3000, which is why
        # nothing looked broken.
        #
        # Set now because #303 gives it a stable external name to state, and
        # because the alerting work in #214 will emit exactly those links.
        server:
          domain: grafana.${SITE_DOMAIN}
          root_url: "https://grafana.${SITE_DOMAIN}/"
        security:
          disable_gravatar: true
          # Only possible since #233 put every route on HTTPS — a secure
          # cookie is simply never sent over plaintext, so setting this
          # before the cutover would have locked everyone out.
          cookie_secure: true
      sidecar:
        # Both sidecars write only into the emptyDirs they mount
        # (/tmp/dashboards and the datasource provisioning dir), so neither
        # needs the root filesystem writable either.
        securityContext:
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        dashboards:
          enabled: true
          searchNamespace: ALL
        datasources:
          enabled: true
      # The memory limit has to hold Grafana's page cache as well as its
      # process: its binary, frontend assets, plugins and SQLite. At 768Mi,
      # idle Grafana sat at ~98% (page cache 520-560MB + process ~250MB), so
      # a cold first dashboard open (+~240MB: search indexes and state
      # rebuilt after idling; a warm open is ~+45MB) could only be paid for
      # by evicting files it was still using. It then re-read them
      # continuously, reached 830m CPU and failed its probes (2026-09-26,
      # #378). 1280Mi covers settled cache + idle process + a cold open with
      # ~270MB spare. The request is unchanged: page cache is reclaimable,
      # and limits reserve no node capacity. The monitoring ResourceQuota
      # has room for it, including the rollout's second pod.
      #
      # To check it holds, read the container cgroup's memory.stat
      # (pgscan_direct, workingset_refault_file) against memory.max; see
      # #378 for the command.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1280Mi
      # An init container whose whole job is to chown /var/lib/grafana to
      # Grafana's UID — which the pod's own `fsGroup: 472` already does when the
      # volume is mounted. It ran as root, added CHOWN, and needed a writable
      # root filesystem to do it, which is five of this pod's audit findings
      # (KSV-0105, 0022, 0106, 0001 and one 0014) for work that was already
      # done. Re-enable only if a storage class turns up that ignores fsGroup;
      # local-path does not.
      initChownData:
        enabled: false

      # The remaining KSV-0014s. Grafana writes its state to the PVC at
      # /var/lib/grafana and the sidecars write to their own emptyDir mounts, so
      # nothing needs a writable root — except /tmp, which Grafana uses for
      # scratch space during provisioning and plugin unpacking.
      #
      # The emptyDir that makes /tmp writable is no longer ours. The grafana
      # subchart mounts one itself, unconditionally and with no value to gate
      # it (`charts/grafana/templates/_pod.tpl`), so the `extraEmptyDirMounts`
      # entry that used to sit here became a second volumeMount on the same
      # path — which the API server rejects outright ("mountPath must be
      # unique"), failing the apply rather than the render.
      containerSecurityContext:
        readOnlyRootFilesystem: true

    prometheus:
      serviceAccount:
        # Chart 90.0.0 added this and defaults it to true: a non-expiring
        # service-account token Secret, minted so the control-plane
        # ServiceMonitors can authenticate. Every one of those is disabled
        # further down this file, so the token has no consumer here and would
        # be a permanent API credential sitting in the namespace for nothing.
        createTokenSecret: false
      prometheusSpec:
        scrapeInterval: 30s
        evaluationInterval: 60s
        # Everything Prometheus scrapes itself, through this chart's own
        # ServiceMonitors (Grafana, Prometheus, Alertmanager, the operator),
        # gets this site's label, as every signal through the collector does
        # (ADR 0003). The default class applies to every ServiceMonitor and
        # PodMonitor without naming them, so a new one needs nothing here.
        # These stay with the chart rather than moving to the collector:
        # they're the chart's own integration (ADR 0005), and its default
        # rules select on the job names they produce.
        scrapeClasses:
          - name: site
            default: true
            relabelings:
              - targetLabel: site
                replacement: ${SITE_NAME}
        # Kept aligned with Loki's `retention_period` in loki.yaml. Metrics are
        # usually what tells you where in the logs to dig, so a window where
        # one has data and the other does not is the window where that stops
        # working. Change these two together or not at all.
        #
        # Retention is a disk decision and nothing else. The TSDB index is
        # per-block, so a query opens only the blocks overlapping its range —
        # a 1h query costs the same whether 7d or 90d sits on disk — and
        # memory tracks active series, of which the head holds ~2h. Cutting
        # retention in #50 looked like it helped the early thermal throttling;
        # #52 found the cause was the 1Gi memory cap, and retention was merely
        # in the same batch.
        #
        # Sized from the measured rate rather than a guess: ~1770 samples/sec
        # at a 60s interval, so ~3540 at 30s, x 86400 x 90d x ~1.2 bytes/sample
        # (~1.05 in chunks, plus index) is ~33GB (2026-11-04). retentionSize
        # sits above that so 90d is what binds, while still capping disk if the
        # ingest rate rises later — whichever is hit first wins. Loki has no
        # size-based equivalent, which is why its retention is load-bearing in
        # a way this one is not.
        #
        # The 14Gi claim below is not the budget: local-path allocates on use
        # and never enforces a claim, so the real ceiling is NVMe free space —
        # 160G of it on 2026-11-04, against ~40GB here and ~3GB for Loki. That
        # makes 90d a policy choice rather than anything the disk forces.
        # Raising the claim would change nothing — volumeClaimTemplates are
        # immutable and local-path cannot expand, so the volume stays 14Gi.
        retention: 90d
        retentionSize: 40GB
        # A single Metrics Drilldown query walked the full label space for 98s
        # (#287) and only stopped because the browser gave up. Nothing bounded
        # it: the defaults are a 2m timeout, 50M samples and 20 concurrent
        # queries, all sized for a server rather than a 4-core Pi.
        #
        # maxSamples is the one that matters — it caps what a single query can
        # pull into memory, and it fails that query instead of the process.
        query:
          timeout: 60s
          maxSamples: 10000000
          maxConcurrency: 4
        # Every site — including this one — pushes through remote write rather
        # than being scraped. See base/collector/.
        enableRemoteWriteReceiver: true
        tsdb:
          # Required, not optional. A remote site that has been offline replays
          # its buffered WAL on reconnect, and Prometheus rejects samples older
          # than its head block's min-valid-time (~2h) as "out of bounds" —
          # without this window the buffer is decorative. Kept equal to the
          # collector's wal.max_keepalive_time in
          # base/collector/collector.alloy; both implement ADR
          # 0003's outage window.
          outOfOrderTimeWindow: 24h
        # ASSUMES(single-node): local-path, k3s's default class, keeps the TSDB
        # on one node and pins Prometheus there. On a second node, losing this
        # one stops all storage until it returns.
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 14Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            # 1 core, not 500m: at 500m, CFS throttled 15-16% of periods once
            # scrapes went to 30 s; at 1 core it is ~1% with the same ~0.1
            # cores of use (#600). GOMAXPROCS stays 1, so one thread can't
            # overrun a full period. Occasional throttling is acceptable here.
            cpu: "1"
            memory: 2Gi

    alertmanager:
      alertmanagerSpec:
        # Alertmanager and its config-reloader read only mounted files; nothing
        # in the pod calls the Kubernetes API, so it carries no token. The
        # operator mounts one by default when this is unset. Prometheus keeps
        # its token: it discovers its ServiceMonitors' targets through the API.
        automountServiceAccountToken: false
        # Mounted at /etc/alertmanager/secrets/<name>/, read by url_file below.
        secrets:
          - alertmanager-healthchecks
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      # Merged over the chart's default config: its inhibit_rules and global
      # stay, but Helm replaces lists whole, so `routes` and `receivers` here
      # are complete, and keep the chart's `null` receiver.
      config:
        route:
          routes:
            # The dead-man's switch (ADR 0007), check akron-alerting-path.
            # Watchdog always fires, so Alertmanager pings healthchecks.io, and
            # healthchecks.io notifies Slack when the pings stop: Akron,
            # Prometheus or Alertmanager down, or Akron's WAN out.
            #
            # Pings arrive every 2 minutes, not every repeat_interval (measured
            # 2026-11-06, #626). Hypothesis: a repeat is only checked on a
            # group_interval tick, and the tick lands just short of a full
            # repeat_interval, so every other tick is skipped. The check's
            # period (2m) matches what arrives, and its grace (10m) is set at
            # healthchecks.io (docs/current-state/host-state.md).
            - receiver: healthchecks
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
        receivers:
          # The chart's top-level route sends every other alert here, which
          # discards it until #214 adds Slack. Removing it leaves that route
          # naming a receiver that doesn't exist, and Alertmanager rejects
          # the whole config.
          - name: "null"
          - name: healthchecks
            webhook_configs:
              # The ping URL is the check's only credential, so it stays in
              # the SOPS Secret rather than in this config.
              - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/ping-url
                # Watchdog never resolves; a resolve would only be a late ping.
                send_resolved: false

    # Scraping moved out of this chart entirely. Akron and every remote site now
    # run the same collector (base/collector/), which discovers these
    # targets itself and pushes over remote write. Keeping both would
    # double-collect on Akron, and the cardinality-trimming rules that used to
    # live here would have needed a second copy in the collector's config —
    # which is exactly the drift the shared component exists to prevent. The
    # rules moved verbatim; they are now in collector.alloy only.
    #
    # node-exporter and kube-state-metrics are still deployed, just from
    # base/collector/ so that both sites get the identical version.
    kubelet:
      enabled: false

    kubeApiServer:
      enabled: false

    nodeExporter:
      enabled: false

    kubeStateMetrics:
      enabled: false

    prometheusOperator:
      kubeletService:
        enabled: false
      # The operator injects a config-reloader sidecar and an
      # init-config-reloader initContainer into every Prometheus and
      # Alertmanager pod, taking their resources from its own CLI flags rather
      # than from the workload's spec. The chart leaves this `{}`, so both
      # arrive with nothing declared and the ResourceQuota on this namespace
      # refuses to create the pod at all — StatefulSet stuck at 0/1, no pod
      # object, no scheduling event.
      #
      # A running pod is not evicted by a quota, so this stays invisible until
      # something restarts it; the 88.2.0 -> 88.4.0 bump did, and Prometheus and
      # Alertmanager were both down for five hours before anyone looked.
      # Nothing renders these values either — they become operator flags, so
      # neither the pipeline nor a `flate` render of the StatefulSet shows them.
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # The webhook cert patch Job (a Helm hook) has no resources by chart
      # default; the ResourceQuota on this namespace requires every pod to
      # declare them.
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

    # The last two objects this chart was still creating in kube-system — a
    # coredns Service+ServiceMonitor, and the Service the operator maintains for
    # kubelet scraping. Both were missed when everything else moved to the
    # collector, so Prometheus was scraping coredns directly while Alloy did
    # not, and the kubelet Service existed for a ServiceMonitor already
    # disabled above. Alloy now scrapes coredns at every site instead
    # (base/collector/collector.alloy), which is where all
    # collection belongs and which Eastbank never had.
    coreDns:
      enabled: false

    kubeControllerManager:
      enabled: false

    kubeScheduler:
      enabled: false

    # K3s's datastore is SQLite, not etcd, and K3s runs no kube-proxy, so
    # there is nothing for either monitor to scrape. Do not add an etcd
    # metrics arg to K3s or try to scrape kube-proxy.
    kubeEtcd:
      enabled: false

    kubeProxy:
      enabled: false
