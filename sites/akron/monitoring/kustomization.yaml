---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespace, HelmRepositories and the site collector are shared with every
  # other site. Akron additionally stores what it collects.
  - ../../../base/metrics-collection
  - resourcequota.yaml
  - kube-prometheus-stack.yaml
  - grafana-secret.sops.yaml
  - grafana-ingressroute.yaml
  - metrics-ingest-service.yaml
  - metrics-ingest-ingressroute.yaml
  - loki.yaml
  - logs-ingest-service.yaml
  - logs-ingest-ingressroute.yaml
  - ./dashboards
