---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespace, HelmRepositories and the metrics collector are shared with every
  # other site. Akron additionally stores what it collects.
  - ../../../base/metrics-collection
  - resourcequota.yaml
  - kube-prometheus-stack.yaml
  - grafana-secret.sops.yaml
  - grafana-ingressroute.yaml
  - prometheus-remotewrite-ingressroute.yaml
  - loki.yaml
  - alloy.yaml
  - loki-push-ingressroute.yaml
  - alloy-syslog-service.yaml
  # Temporary; see docs/runbooks/trivy-operator-audit.md.
  - ../../../base/trivy-operator
  - ./dashboards

# See base/metrics-collection/kustomization.yaml for why the hash is disabled.
configMapGenerator:
  - name: alloy-logs-config
    namespace: monitoring
    options:
      disableNameSuffixHash: true
    files:
      - config.alloy=alloy.alloy
