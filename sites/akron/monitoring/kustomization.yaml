---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespace, HelmRepositories and the metrics collector are shared with every
  # other site. Akron additionally stores what it collects.
  - ../../../base/metrics-collection
  - resourcequota.yaml
  - kube-prometheus-stack.yaml
  - grafana-secret.sops.yaml
  - grafana-ingressroute.yaml
  - prometheus-remotewrite-ingressroute.yaml
  - loki.yaml
  - alloy.yaml
  - ./unpoller
  - alloy-syslog-service.yaml
  - ./dashboards
